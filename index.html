<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Tracker</title>
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f2ea;--card:#ffffff;--ink:#1e281e;--muted:#6b7266;--line:#e2ded2;
  --green:#2f6b3a;--green2:#e4efe0;--red:#b3261e;--red2:#fbe7e4;--amber:#9a6200;--amber2:#fff1d1;
  --blue:#245d8f;--blue2:#e3eef8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .sync{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}
.pos{color:var(--green)}.neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:20px;font-weight:700;margin-top:2px;word-break:break-word}
.stat.pos{background:var(--green2);border-color:#c5dbbf}.stat.neg{background:var(--red2);border-color:#f0c7c0}
.pcard{cursor:pointer}
.pc-top{display:flex;align-items:center;gap:10px}
.emoji{font-size:30px;line-height:1}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#eee;white-space:nowrap}
.st-planned{background:#ececec}.st-land_prep{background:var(--amber2);color:var(--amber)}
.st-growing{background:var(--green2);color:var(--green)}.st-harvesting{background:var(--blue2);color:var(--blue)}
.st-done{background:#e6e3da;color:#555}
.bar{height:6px;background:#ece9df;border-radius:6px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.pc-nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;cursor:pointer;background:var(--blue2)}
.alert.warn{background:var(--amber2)}.alert.danger{background:var(--red2)}
.rowi{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rowi:last-child{border-bottom:0}.rowi .ic{font-size:22px;width:28px;text-align:center}
.month{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.sm{padding:7px 11px;font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:#fff;border:1px solid #cfcabb;border-radius:10px;padding:10px}
textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}.check input{width:auto;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:130px;background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--muted);cursor:pointer}
nav button span{display:block;font-size:21px}nav button.on{color:var(--green);font-weight:700}
.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
.sheet-h b{flex:1}.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink)}
#m_body{padding:4px 16px 16px;overflow-y:auto}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}.sheet-f:empty{display:none}
.menu button{display:flex;width:100%;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.cbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.cbar .n{width:150px;flex-shrink:0}.cbar .t{flex:1;background:#ece9df;height:10px;border-radius:6px;overflow:hidden}
.cbar .t i{display:block;height:100%;background:var(--green)}.cbar .a{width:100px;text-align:right}
.task{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.task input{width:22px;height:22px;margin:0;flex-shrink:0}
.task.done .lbl{text-decoration:line-through;color:var(--muted)}
.task.late .due{color:var(--red);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
details summary{font-weight:700;cursor:pointer;font-size:16px}
details ul{padding-left:20px;margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;font-weight:600}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
@media(max-width:480px){.cbar .n{width:110px}.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:1/-1}}

/* ---------- Worker screen (dako nga buttons) ---------- */
body.worker .fab{display:none}
body.worker main{padding-bottom:40px}
.wk-top{text-align:center;margin:4px 0 12px}
.wk-h1{font-size:22px;font-weight:800;letter-spacing:.5px;color:var(--green)}
.wk-date{font-size:15px;color:var(--muted)}
.wk-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0}
.wk-tabs button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.wk-tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.wk-card{background:var(--card);border:2px solid var(--line);border-left-width:8px;border-radius:16px;padding:16px;margin-bottom:14px;font-size:17px}
.wk-card.todo{border-left-color:#d93025}.wk-card.wait{border-left-color:#e3a008;background:#fffbea}.wk-card.done{border-left-color:var(--green)}
.wk-head{display:flex;gap:12px;align-items:center}
.wk-icon{font-size:40px;line-height:1}.wk-icon.sm{font-size:24px;width:30px;text-align:center}
.wk-title{font-size:22px;font-weight:800}.wk-title.long{font-size:17px;line-height:1.3}
.wk-st{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px}
.wk-st.red{background:#fde2e0;color:#b3261e}.wk-st.yel{background:#fff1c2;color:#8a5a00}.wk-st.grn{background:var(--green2);color:var(--green)}.wk-st.gry{background:#eee;color:#555}
.wk-sub{font-size:15px;margin:10px 0 0;line-height:1.5}
.wk-body{margin-top:10px;line-height:1.5}.wk-body p{margin:8px 0}
.wk-label{font-weight:700;font-size:17px}
.wk-steps{padding-left:22px;margin:8px 0}.wk-steps li{margin:6px 0}
.wk-late{background:#fde2e0;color:#b3261e;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:15px;font-weight:600}
.wk-waitinfo{background:#fff1c2;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:15px;font-weight:600}
.wk-warn{background:#fff1c2;border-radius:12px;padding:12px;margin:10px 0;font-size:16px}
.wk-fert{background:var(--green2);border-radius:12px;padding:12px;margin:10px 0}
.wk-amt{font-size:26px;font-weight:800;color:var(--green);margin-top:4px}.wk-amt span{font-size:15px;font-weight:600;color:var(--ink)}
.wk-rain{background:var(--blue2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.wk-safety{background:#fde2e0;border-radius:12px;padding:12px;margin-top:10px;font-size:15px}.wk-safety ul{padding-left:20px;margin:6px 0 0}
.wk-tbl td{font-size:15px;padding:7px 0}.wk-tbl td:first-child{color:var(--muted);width:45%}
.wk-btns{display:grid;gap:10px;margin-top:14px}
.bigbtn{display:block;width:100%;border:0;border-radius:14px;padding:18px 12px;min-height:62px;font-size:19px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;text-align:center;letter-spacing:.3px;box-sizing:border-box}
.bigbtn:active{transform:scale(.98)}
.bigbtn.ghost{background:#fff;color:var(--ink);border:2px solid #cfcabb}
.bigbtn.yellow{background:#fff1c2;color:#6b4500;border:2px solid #e3c25b}
.bigbtn.orange{background:#e8710a}.bigbtn.red{background:#b3261e}
.wk-reasons{display:grid;gap:10px;margin-top:8px}
.wk-choices{display:grid;gap:8px}
.choice{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.choice.on{border-color:var(--green);background:var(--green2);font-weight:700}
.wk-help{display:grid;gap:10px}
.wk-phi{background:#fde2e0;color:#7a1610;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:16px}
.wk-empty{text-align:center;font-size:18px;padding:40px 10px;color:var(--muted);background:var(--card);border-radius:16px;border:2px dashed var(--line)}
.wk-day{font-weight:800;font-size:15px;margin:16px 0 6px;color:var(--green)}
.wk-row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:16px}
/* ---------- Partehanay / roles ---------- */
.wk-who{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px}
.wk-who.ct{background:var(--blue2);color:var(--blue)}.wk-who.paid{background:#f1e7ff;color:#5b2a9a}
.wk-me{display:inline-block;margin-top:6px;background:var(--blue2);color:var(--blue);font-weight:800;padding:4px 14px;border-radius:20px;font-size:16px}
.wk-tabs.four{grid-template-columns:repeat(4,1fr)}.wk-tabs.four button{font-size:12px;padding:12px 2px}
.labor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.labor-grid .bigbtn{font-size:24px;padding:14px 0}
.sh-card .tbl td{font-size:14px}
@media print{header,nav,.fab,.btnrow,.tabs{display:none}main{padding:0}}
</style>
</head>
<body>
<header>
  <h1>🌱 Farm Tracker</h1>
  <button class="sync" id="installBtn" style="display:none" onclick="installApp()">📲 Install</button>
  <button class="sync" id="syncBtn" onclick="syncNow()">☁ Sync</button>
</header>
<main id="main"></main>
<button class="fab" onclick="addMenu()" aria-label="Add">+</button>
<nav id="nav"></nav>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-h"><b id="m_title"></b><button class="x" onclick="closeModal()">✕</button></div>
    <div id="m_body"></div>
    <div class="sheet-f" id="m_foot"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   FARM TRACKER — farm records, planting to harvest
   Data: saved on this device (localStorage) + optional
   sync to a JSON file in your own GitHub repository.
   ========================================================= */

const KEY = 'umaTracker.data.v1', CFG = 'umaTracker.cfg.v1';

/* ---------- Crops ---------- */
const CROPS = {
  sweet_corn:  {name:'Sweet Corn', emoji:'🌽', days:75},
  kalabasa:    {name:'Kalabasa (Squash)', emoji:'🎃', days:100},
  broccoli:    {name:'Broccoli', emoji:'🥦', days:70},
  green_onion: {name:'Green Onion (Sibuyas Dahon)', emoji:'🌱', days:60},
  cabbage:     {name:'Cabbage (Repolyo)', emoji:'🥬', days:80},
  tomato:      {name:'Tomato (Kamatis)', emoji:'🍅', days:70},
  eggplant:    {name:'Eggplant (Talong)', emoji:'🍆', days:75},
  ampalaya:    {name:'Ampalaya', emoji:'🥒', days:65},
  sitaw:       {name:'Sitaw', emoji:'🫛', days:60},
  pechay:      {name:'Pechay', emoji:'🥬', days:35},
  pepper:      {name:'Pepper (Sili)', emoji:'🌶️', days:80},
  other:       {name:'Other', emoji:'🌿', days:60}
};

const STATUS = {planned:'Plano pa', land_prep:'Land Prep', growing:'Nagatubo', harvesting:'Harvesting', done:'Tapos na'};

const CATS = {
  land_prep:      {name:'Land Prep (Pag-preparar sang duta)', short:'Land Prep', icon:'🚜'},
  seeds:          {name:'Seeds / Seedlings (Binhi)', short:'Binhi', icon:'🌰'},
  planting:       {name:'Planting / Transplanting', short:'Planting', icon:'🌱'},
  fertilizer:     {name:'Fertilizer (Abono)', short:'Abono', icon:'🧪'},
  pesticide:      {name:'Pesticide / Fungicide (Spray)', short:'Spray', icon:'💧'},
  pest_monitoring:{name:'Pest Monitoring', short:'Pest Monitoring', icon:'🔍'},
  irrigation:     {name:'Irrigation / Tubig', short:'Tubig', icon:'🚿'},
  weeding:        {name:'Weeding / Cultivation (Hilamon)', short:'Weeding', icon:'🌿'},
  labor:          {name:'Labor (Trabahador)', short:'Labor', icon:'👷'},
  materials:      {name:'Materials / Tools (mulch, trellis, etc.)', short:'Materials', icon:'🧰'},
  harvest_cost:   {name:'Harvest & Hauling (Gasto)', short:'Harvest/Hauling', icon:'🧺'},
  transport:      {name:'Transport / Pamasahe / Gasolina', short:'Transport', icon:'🛻'},
  other:          {name:'Other / Iban pa', short:'Other', icon:'📌'}
};

/* ---------- Cultural management schedule templates (default) ----------
   [adlaw gikan sa pagtanom/transplant, category, trabaho, instruksyon]
   'H' = adlaw sa harvest (gikan sa "Days to harvest").
   Ang admin makausab niini sa Settings → Crop Schedule. Walay dosage dinhi:
   ang abono ug dosage i-set sa admin base sa soil test / technician. */
const TASKS = {
  sweet_corn: [
    [-14,'land_prep','Pag-daro (plowing)','Darohi mga 20–25 cm kalalom kon sakto ang kabasa sa yuta (dili lapok, dili uga kaayo). Kuhaa ang dagkong bato ug gamot sa sagbot.'],
    [-7,'land_prep','Harrowing ug pag-tudling (75 cm ang gilay-on)','Harrow 1–2 ka higayon hangtod mohumok ang yuta. Himoa ang tudling nga 75 cm ang gilay-on. Kon bakilid, tabok sa bakilid ang tudling.'],
    [-7,'fertilizer','Compost / organic nga abono','Isabwag ang compost o manure sa tudling ug tabuni og yuta. Kinahanglan dunot na ang manure (dili presko).'],
    [0,'planting','Pagtanom + basal nga abono','Ibutang ang basal nga abono sa tudling ug tabuni og nipis nga yuta una ibutang ang binhi aron dili masunog. 1–2 ka binhi kada lungag, 2–3 cm kalalom.'],
    [7,'pest_monitoring','Check sa mitubo, tamni ang wala mitubo','Lakaw sa matag laray. Ang lungag nga walay mitubo, tamni dayon og bag-o. Tan-awa usab kung naay cutworm (pinutol nga punoan).'],
    [12,'weeding','Thinning (1 ka tanom kada lungag) + pag-gabot sa sagbot','Bilini ang usa ka pinakanindot nga tanom kada lungag. Putla (ayaw ibton) ang uban aron dili madaot ang gamot. Gabuta ang sagbot samtang gamay pa.'],
    [14,'pest_monitoring','Check sa fall armyworm sa whorl','Tan-awa ang 20 ka tanom sa lain-laing dapit. Tan-awa ang sulod sa whorl (tunga sa tanom): buslot sa dahon ug hugaw sa ulod nga murag gabas = fall armyworm.'],
    [25,'fertilizer','1st sidedress + hilling-up','Ibutang ang abono 5–10 cm gikan sa punoan, dayon tabuni og yuta (hilling-up). Mas maayo kon basa-basa ang yuta.'],
    [30,'weeding','Pag-gabot sa sagbot / off-barring','Limpyohi ang sagbot sa tunga sa mga laray. Ayaw samdi ang gamot sa mais.'],
    [45,'fertilizer','2nd sidedress (una mogawas ang tassel)','Pareha sa 1st sidedress: 5–10 cm gikan sa punoan, tabuni. Importante kini una mogawas ang tassel aron dagko ang dalumpit.'],
    [55,'pest_monitoring','Silking: check sa corn earworm','Tan-awa ang buhok (silk) ug tumoy sa dalumpit kung naay ulod. Siguroha nga dili kulang ang tubig karon nga stage.'],
    ['H','harvest_cost','Harvest (milk stage, sa buntag)','Pislita ang lugas — kinahanglan naay murag gatas nga tubig. Ani sa buntag samtang bugnaw ug ibaligya dayon. I-check una ang PHI sa spray.']
  ],
  kalabasa: [
    [-14,'land_prep','Pag-daro','Darohi mga 20–25 cm. Limpyohi ang sagbot ug bato.'],
    [-7,'land_prep','Harrowing + paghimo og hills (2–3 m ang gilay-on sa laray)','Harrow ug himoa ang hills/lungag: 2–3 m tali sa laray, 1–2 m tali sa hills.'],
    [-7,'fertilizer','Compost / organic kada hill','Butangi og 1–2 ka pala nga dunot nga compost o manure kada hill ug isagol sa yuta.'],
    [0,'planting','Pagtanom (2–3 ka binhi kada hill) + basal nga abono','Ibutang ang basal nga abono sa hill ug tabuni una og yuta. 2–3 ka binhi kada hill, 2–3 cm kalalom.'],
    [7,'pest_monitoring','Check sa mitubo, tamni ang wala mitubo','Ang hill nga walay mitubo, tamni og bag-o. Tan-awa kung naay squash beetle (orange nga insekto) sa batan-on nga dahon.'],
    [14,'weeding','Thinning + pag-gabot sa sagbot','Bilini ang 1–2 ka pinakanindot nga tanom kada hill. Limpyohi ang sagbot palibot sa hill.'],
    [21,'pest_monitoring','Check sa squash beetle ug aphids','Tan-awa ang ibabaw ug ilalom sa dahon. Orange nga insekto = squash beetle. Gagmay nga kuto sa ilalom sa dahon = aphids.'],
    [28,'fertilizer','Sidedress sa pagkamang sa balagon','Kon nagsugod na mokamang ang balagon: ibutang ang abono palibot sa hill (dili sa punoan mismo), tabuni og yuta.'],
    [45,'pest_monitoring','Pagpamulak: check sa bunga ug fruit fly','Tan-awa kung naay bunga nga nagporma. Kon daghan bulak pero walay bunga, pagpollinate gamit ang kamot sa buntag (6–9 AM).'],
    [55,'fertilizer','Sidedress para sa bunga','Ibutang ang abono palibot sa hill ug tabuni. Butangi og uhot o karton ang ilalom sa bunga aron dili madunot.'],
    ['H','harvest_cost','Harvest (gahi na ang panit, uga na ang tangkay)','Gahi na ang panit (dili ma-dent sa kuko) ug uga na ang tangkay. Putla nga naay 3–5 cm nga tangkay. I-check una ang PHI.']
  ],
  broccoli: [
    [-30,'seeds','Pagpugas sa seedling trays','Gamita ang humok nga media (yuta + compost o carbonized rice hull). 1 ka binhi kada cell. Atopi aron dili initan ug ulanon. Bisbisi gamay sa buntag ug hapon.'],
    [-14,'land_prep','Pag-daro','Darohi mga 20–25 cm.'],

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? parseD(s).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'}) : '';
const fmtMonth = s => parseD(s).toLocaleDateString('en-PH', {month:'long', year:'numeric'});
const money = n => '₱' + (Number(n)||0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const sum = (arr, f) => arr.reduce((t, x) => t + (Number(f(x)) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const num = id => { const s = v(id); if (s === '' || s == null) return null; const n = parseFloat(s); return isNaN(n) ? null : n; };

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- Data ---------- */
const COLLS = ['plantings','activities','harvests','orders','templates','settings'];
const emptyDb = () => ({plantings:[], activities:[], harvests:[], orders:[], templates:[], settings:[], deleted:{}});
function loadDb(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.plantings)) return Object.assign(emptyDb(), d); } catch(e){}
  return emptyDb();
}
let db = loadDb();
function cfg(){ try { return JSON.parse(localStorage.getItem(CFG)) || {}; } catch(e){ return {}; } }
function setCfg(c){ localStorage.setItem(CFG, JSON.stringify(c)); }

function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }
let editSeq = 0;
function save(){
  editSeq++;
  persist();
  const c = cfg(); c.dirty = true; setCfg(c);
  updateSyncBtn();
  statsCache.clear();
  if (c.auto && c.token) { clearTimeout(save._t); save._t = setTimeout(() => syncNow(true), 1500); }
}
function upsert(coll, rec){
  rec.updatedAt = nowISO();
  if (!rec.id) { rec.id = uid(); rec.createdAt = rec.updatedAt; }
  const arr = db[coll]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  save(); return rec;
}
function removeRec(coll, id){
  db[coll] = db[coll].filter(x => x.id !== id);
  db.deleted[id] = nowISO();
}

/* Merge two copies (this phone + GitHub). Newer edit wins; deletions are remembered. */
function mergeDb(a, b){
  const out = emptyDb();
  out.deleted = Object.assign({}, a.deleted || {});
  for (const [k, t] of Object.entries((b && b.deleted) || {})) if (!out.deleted[k] || t > out.deleted[k]) out.deleted[k] = t;
  for (const c of COLLS) {
    const m = new Map();
    for (const r of [...(a[c]||[]), ...((b && b[c])||[])]) {
      const e = m.get(r.id);
      if (!e || (r.updatedAt||'') > (e.updatedAt||'')) m.set(r.id, r);
    }
    out[c] = [...m.values()].filter(r => !(out.deleted[r.id] && out.deleted[r.id] >= (r.updatedAt||'')));
  }
  return out;
}

/* ---------- Domain ---------- */
const crop = p => CROPS[p.crop] || CROPS.other;
const pName = p => (p.crop === 'other' && p.customName ? p.customName : crop(p).name.split(' (')[0]) + (p.variety ? ` – ${p.variety}` : '') + (p.batch ? ` (${p.batch})` : '');
const getP = id => db.plantings.find(p => p.id === id);
const areaLbl = p => p.area ? `${p.area} ${p.areaUnit === 'ha' ? 'ha' : p.areaUnit === 'sqm' ? 'sq.m' : (p.areaUnit||'')}` : '';
const areaHa = p => !p.area ? null : p.areaUnit === 'ha' ? +p.area : p.areaUnit === 'sqm' ? +p.area / 10000 : null;

const statsCache = new Map();
function stats(pid){
  if (!statsCache.has(pid)) statsCache.set(pid, statsRaw(pid));
  return statsCache.get(pid);
}
function statsRaw(pid){
  const acts = db.activities.filter(a => a.plantingId === pid);
  const hv = db.harvests.filter(h => h.plantingId === pid);
  const cost = sum(acts, a => a.cost), income = sum(hv, h => h.total);
  const byCat = {}; acts.forEach(a => byCat[a.category] = (byCat[a.category]||0) + (Number(a.cost)||0));
  const units = {}; hv.forEach(h => { const u = h.unit || 'kg'; units[u] = (units[u]||0) + (Number(h.qty)||0); });
  const unit = Object.keys(units).sort((x,y) => units[y]-units[x])[0] || 'kg';
  const agent = sum(hv, hvAgent), gen = genAlloc(pid), allCost = cost + agent + gen, net = income - allCost;
  const p = getP(pid), ct = p ? ctById(p.caretakerId) : null, ctPct = ct ? (ct.pct ?? DEFAULT_CT_PCT) : 0;
  const ctShare = ct && net > 0 ? net * ctPct / 100 : 0;
  return {acts, hv, cost, income, agent, gen, allCost, net, roi: allCost ? net / allCost * 100 : null, byCat, units, unit, qty: units[unit] || 0,
    ct, ctPct, ctShare, owner: net - ctShare};
}

function schedule(p){
  const legacy = p.done || {};                       // daan nga "done" (gikan sa una nga version)
  return getTpl(p.crop).tasks.map((x, i) => {
    const off = x.off === 'H' ? (Number(p.days)||0) : (Number(x.off)||0);
    const key = taskKey(p.id, 't', x.id), rec = recByKey(key);
    const done = rec ? (rec.outcome === 'done' ? rec.date : null) : (legacy[x.id] || null);
    return {i, id:x.id, key, off, cat:x.cat, who:x.who || null, label:x.label, how:x.how || '', fert:x.fert || [], due:addDays(p.datePlanted, off), done, rec};
  });
}

function getAlerts(){
  const out = [], t = today();
  for (const p of db.plantings) {
    if (p.status === 'done' || !p.datePlanted) continue;
    const c = crop(p), nm = `${c.emoji} <b>${esc(pName(p))}</b>`;
    // pesticide pre-harvest interval
    db.activities.filter(a => a.plantingId === p.id && a.category === 'pesticide' && Number(a.phi) > 0).forEach(a => {
      const safe = addDays(a.date, Number(a.phi));
      if (safe > t) out.push({lvl:'danger', sort:-200, pid:p.id, html:`⚠️ ${nm}: Ayaw anay mag-harvest tubtob <b>${fmtD(safe)}</b> (PHI sang ${esc(a.item || 'spray')})`});
    });
    db.activities.filter(a => a.plantingId === p.id && a.needsCost && !Number(a.cost)).forEach(a => out.push({lvl:'warn', sort:-90, pid:p.id,
      html:`💵 ${nm}: Ibutang ang bayad — ${esc(a.desc)} (${a.qty} ka tawo, ${fmtD(a.date)})`}));
    // reports gikan sa trabahante
    db.activities.filter(a => a.plantingId === p.id && (a.pestFound || a.help) && diffDays(a.date, t) <= 7).forEach(a => {
      const hasOrder = db.orders.some(o => o.plantingId === p.id && !o.cancelled && o.date >= a.date);
      if (a.help && a.outcome !== 'done') out.push({lvl:'danger', sort:-180, pid:p.id, html:`🆘 ${nm}: Nangayo og <b>TABANG</b> ang trabahante sa pest check (${fmtD(a.date)})`});
      else if (a.pestFound && !hasOrder) out.push({lvl:'danger', sort:-170, pid:p.id, html:`🐛 ${nm}: Naay peste nakit-an — <b>${esc(a.pest)}</b> (${esc(a.severity)})${a.photo ? ' 📷' : ''}. I-review; himoa ang Spray Order kon kinahanglan gyud.`});
    });
    // pest monitoring
    if (['growing','harvesting'].includes(p.status)) {
      const mons = db.activities.filter(a => a.plantingId === p.id && a.category === 'pest_monitoring').sort((x,y) => x.date.localeCompare(y.date));
      const last = mons[mons.length-1];
      if (last && last.severity === 'High' && diffDays(last.date, t) <= 7)
        out.push({lvl:'danger', sort:-150, pid:p.id, html:`🐛 ${nm}: HIGH nga pest/disease — ${esc(last.pest || '')} (${fmtD(last.date)})`});
      if (!last || diffDays(last.date, t) > 7)
        out.push({lvl:'warn', sort:-100, pid:p.id, html:`🔍 ${nm}: Wala pa pest monitoring ${last ? 'kutob ' + fmtD(last.date) : ''} — mag-scout na`});
    }
    // schedule tasks
    for (const s of schedule(p)) {
      if (s.done) continue;
      const d = diffDays(t, s.due);
      if (d <= 7 && d >= -14) out.push({lvl: d < 0 ? 'warn' : 'info', sort:d, pid:p.id,
        html:`${CATS[s.cat]?.icon || '📌'} ${nm}: ${esc(s.label)} — ${d < 0 ? `<b>${-d} ka adlaw late</b>` : d === 0 ? '<b>subong nga adlaw</b>' : `sa ${d} ka adlaw`}`});
    }
  }
  return out.sort((a,b) => a.sort - b.sort);
}

  state.view = view === 'today' ? 'work' : (view || 'work'); state.pid = pid || null;

    (worker ? `<div style="text-align:center;margin-top:30px"><button class="btn sm ghost" onclick="adminUnlock()">🔒 Admin</button></div>` : '');

  updateSyncBtn();
}


/* =========================================================
   TRABAHO KARONG ADLAWA — patubig, abono, pest check, spray
   - Ang schedule gi-compute gikan sa petsa sa pagtanom (walay
     gi-save nga tasks → walay duplicate; mo-update kon usbon ang petsa).
   - Ang DONE mohimo og activity record nga naay taskKey.

  kalabasa:   {waterYoung:1, waterOld:2, pestEvery:7},

function defaultTemplate(cropKey){
  const src = TASKS[cropKey] || TASKS.other;
  return {id:cropKey, tasks: src.map((t, i) => ({id:String(i), off:t[0], cat:t[1], label:t[2], how:t[3] || '', fert:[]})),
          opts: Object.assign({}, TPL_OPTS.other, TPL_OPTS[cropKey] || {})};
}
function getTpl(cropKey){
  const t = db.templates.find(x => x.id === cropKey);
  const d = defaultTemplate(cropKey);
  if (!t || !Array.isArray(t.tasks)) return d;
  return {id:cropKey, tasks:t.tasks, opts:Object.assign({}, d.opts, t.opts || {}), custom:true};
}

/* ---------- Planting size helpers (para sa abono) ---------- */
function plantingHa(p){
  const ha = areaHa(p);
  if (ha) return ha;
  if (p.calc) { const r = calcPlan(Object.assign({}, p.calc, {area:p.area, areaUnit:p.areaUnit})); if (r.sqm) return r.sqm / 10000; }
  return null;
}
function plantCount(p){
  if (p.areaUnit === 'plants' && p.area) return Math.round(+p.area);
  if (p.calc) { const r = calcPlan(Object.assign({}, p.calc, {area:p.area, areaUnit:p.areaUnit})); return r.plants || r.hills || null; }
  return null;
}
const FERT_UNITS = {'kg/ha':'kg kada hectare', 'bags/ha':'sako (50 kg) kada hectare', 'g/plant':'gramo kada tanom'};
function fertNeed(p, line){
  const ha = plantingHa(p), plants = plantCount(p), rate = +line.rate || 0;
  let kg = null;
  if (rate && line.unit === 'kg/ha' && ha) kg = rate * ha;
  else if (rate && line.unit === 'bags/ha' && ha) kg = rate * 50 * ha;
  else if (rate && line.unit === 'g/plant' && plants) kg = rate * plants / 1000;
  return {kg, bags: kg != null ? kg / 50 : null, perPlant: kg != null && plants ? kg * 1000 / plants : null, ha, plants};
}
const fmtKg = kg => kg >= 100 ? fmtN(kg, 0) : kg >= 10 ? fmtN(kg, 1) : fmtN(kg, 2);
function fertLinesHtml(p, lines, big){
  if (!lines || !lines.length) return `<div class="wk-warn">⚠️ Wala pa gi-set sa admin ang abono ug dosage niini.<br><b>Pangutana una sa manager</b> unsa ug pila ang ibutang.</div>`;
  return lines.map(l => {
    const n = fertNeed(p, l);
    const total = n.kg != null
      ? `<div class="wk-amt">${fmtKg(n.kg)} kg${n.bags >= 0.25 ? ` <span>(mga ${fmtN(n.bags, 1)} ka sako nga 50 kg)</span>` : ''}</div>
         ${n.perPlant != null ? `<div class="small">≈ ${fmtN(n.perPlant, 1)} gramo kada tanom (${fmtN(n.plants)} ka tanom)</div>` : ''}`
      : `<div class="small neg">Dili ma-compute: kulang ang ${l.unit === 'g/plant' ? 'gidaghanon sa tanom' : 'area'} sa planting record.</div>`;
    return `<div class="wk-fert"><b>${esc(l.name || 'Abono')}</b>
      <div class="small muted">Dosage: ${fmtN(l.rate, 2)} ${FERT_UNITS[l.unit] || esc(l.unit)}${n.ha ? ` · Area: ${fmtN(n.ha, 3)} ha` : ''}${l.src ? ` · Basehan: ${esc(l.src)}` : ''}</div>
      ${total}</div>`;
  }).join('');
}

/* ---------- Task engine ---------- */
const DONE_REASONS = ['NAULAN', 'BASA PA ANG YUTA'];             // patubig: na-check, dili kinahanglan
const WATER_REASONS = ['WALAY TUBIG', 'NAULAN', 'BASA PA ANG YUTA', 'WALA NAHUMAN', 'UBAN PANG RASON'];
const SKIP_REASONS = ['WALAY MATERYALES', 'NAULAN', 'WALA NAHUMAN', 'UBAN PANG RASON'];

function waterEvery(p, dap, o){
  if (o.waterCritFrom != null && dap >= o.waterCritFrom && dap <= (o.waterCritTo ?? o.waterCritFrom)) return 1;
  return dap <= 14 ? (+o.waterYoung || 1) : (+o.waterOld || 2);
}
function pestEvery(p, dap, o){
  if (o.pestEarly && dap <= (o.pestEarlyUntil || 0)) return +o.pestEarly;
  return +o.pestEvery || 7;
}
function recStatus(rec){
  if (!rec) return null;
  if (rec.outcome === 'done') return 'done';
  return 'wait';
}
/* Returns all task instances from (today-21) to (today+7) */
function workItems(){
  const t = today(), horizon = addDays(t, 7), items = [];
  const ctF = myCaretaker();
  const mine = p => !ctF || p.caretakerId === ctF;
  for (const p of db.plantings) {
    if (p.status === 'done' || !p.datePlanted || !mine(p)) continue;
    const dap = diffDays(p.datePlanted, t), tpl = getTpl(p.crop), o = tpl.opts;
    const base = {p, dap};
    // 1) Template tasks
    for (const s of schedule(p)) {
      if (s.due > horizon) continue;
      const st = s.done ? 'done' : recStatus(s.rec);
      if (!st && diffDays(s.due, t) > 21) continue;               // daan na kaayo, wala na gipakita
      if (!st && s.off < 0 && dap >= 0) continue;                 // trabaho una sa pagtanom: natanom na, dili na ipakita
      const kind = s.cat === 'fertilizer' ? 'fert' : s.cat === 'pest_monitoring' ? 'pest' : s.cat === 'irrigation' ? 'water' : 'task';
      items.push(Object.assign({}, base, {kind, key:s.key, tid:s.id, due:s.due, off:s.off, cat:s.cat, who:s.who, label:s.label, how:s.how, fert:s.fert,
        status: st || (s.due <= t ? 'todo' : 'next'), rec:s.rec, doneDate:s.done}));
    }
    if (dap < 0 || p.status === 'planned' || p.status === 'land_prep' && dap < 0) continue;
    // 2) Patubig (recurring check)
    const wr = db.activities.filter(a => a.plantingId === p.id && a.category === 'irrigation').sort((a,b) => (a.date + (a.doneAt||'')).localeCompare(b.date + (b.doneAt||'')));
    const wLast = wr[wr.length - 1];
    const wGap = waterEvery(p, dap, o);
    const wToday = wr.filter(a => a.date === t).pop();
    if (wToday) items.push(Object.assign({}, base, {kind:'water', key:wToday.taskKey || taskKey(p.id,'water',t), due:t, label:'PATUBIG', status: wToday.outcome === 'done' || DONE_REASONS.includes(wToday.reason) ? 'done' : 'wait', rec:wToday}));
    let wNext = !wLast ? t : addDays(wLast.date, wLast.outcome === 'done' || DONE_REASONS.includes(wLast.reason) ? wGap : 1);
    if (wNext < p.datePlanted) wNext = p.datePlanted;
    if (!wToday && wNext <= t) items.push(Object.assign({}, base, {kind:'water', key:taskKey(p.id,'water',t), due:t, label:'PATUBIG', status:'todo', since:wNext < t ? wNext : null}));
    else if (wNext > t && wNext <= horizon) items.push(Object.assign({}, base, {kind:'water', key:taskKey(p.id,'water',wNext), due:wNext, label:'PATUBIG (check)', status:'next'}));
    // 3) Pest check (recurring; dili mo-doble sa template pest task)
    if (dap >= 7) {
      const pr = db.activities.filter(a => a.plantingId === p.id && a.category === 'pest_monitoring').sort((a,b) => (a.date + (a.doneAt||'')).localeCompare(b.date + (b.doneAt||'')));
      const pLast = pr[pr.length - 1];
      let pNext = pLast ? addDays(pLast.date, pLast.outcome === 'help' ? 1 : pestEvery(p, dap, o)) : t;
      const tplPestSoon = items.some(x => x.p === p && x.kind === 'pest' && x.key.includes(':t:') && (x.status === 'todo' || x.status === 'wait' || (x.status === 'next' && x.due <= addDays(pNext, 1))));
      const pToday = pr.filter(a => a.date === t && (!a.taskKey || a.taskKey.includes(':pest:'))).pop();
      if (pToday && !items.some(x => x.rec === pToday)) items.push(Object.assign({}, base, {kind:'pest', key:pToday.taskKey || taskKey(p.id,'pest',t), due:t, label:'CHECK SA PESTE', status:recStatus(pToday) || 'done', rec:pToday}));
      else if (!tplPestSoon && !pToday) {
        if (pNext <= t) items.push(Object.assign({}, base, {kind:'pest', key:taskKey(p.id,'pest',t), due:t, label:'CHECK SA PESTE', status:'todo'}));
        else if (pNext <= horizon) items.push(Object.assign({}, base, {kind:'pest', key:taskKey(p.id,'pest',pNext), due:pNext, label:'CHECK SA PESTE', status:'next'}));
      }
    }
    // 4) Pamupo (crops nga daghang higayon ma-harvest)
    if (p.status === 'harvesting' && MULTI_PICK.includes(p.crop)) {
      const hs = [...db.harvests.filter(h => h.plantingId === p.id).map(h => h.date),
        ...db.activities.filter(a => a.plantingId === p.id && a.taskKey && a.taskKey.includes(':pick:') && a.outcome === 'done').map(a => a.date)].sort();
      const last = hs[hs.length - 1], kToday = taskKey(p.id, 'pick', t), rToday = recByKey(kToday);
      const nx = last ? addDays(last, 3) : t;
      const pick = {kind:'task', cat:'harvest_cost', label:'Pamupo / harvest', how:'Pamupoa ang hinog na. Ilain ang maayo ug ang reject. Isulti sa admin pila ka kilo.'};
      if (rToday) items.push(Object.assign({}, base, pick, {key:kToday, due:t, status:recStatus(rToday), rec:rToday}));
      else if (nx <= t) items.push(Object.assign({}, base, pick, {key:kToday, due:t, status:'todo'}));
      else if (nx <= horizon) items.push(Object.assign({}, base, pick, {key:taskKey(p.id, 'pick', nx), due:nx, status:'next'}));
    }
  }
  // 5) Spray orders (gikan ra sa admin — walay automatic spray)
  for (const o of db.orders) {
    const p = getP(o.plantingId);
    if (!p || o.cancelled || !mine(p)) continue;
    const key = taskKey(p.id, 'spray', o.id), rec = recByKey(key);
    const st = recStatus(rec) || (o.date <= today() ? 'todo' : 'next');
    if (st === 'next' && o.date > addDays(today(), 7)) continue;
    items.push({p, dap:diffDays(p.datePlanted, today()), kind:'spray', key, due:o.date, label:'PAG-SPRAY', order:o, status:st, rec});
  }
  const order = {spray:0, water:1, fert:2, pest:3, task:4};
  items.sort((a,b) => a.due.localeCompare(b.due) || (order[a.kind] - order[b.kind]));
  return items;
}

/* ---------- Recording ---------- */
const CAT_OF = {water:'irrigation', fert:'fertilizer', pest:'pest_monitoring', spray:'pesticide'};
function findItem(key){ return workItems().find(x => x.key === key); }
function recordItem(x, outcome, extra = {}){
  const existing = recByKey(x.key);
  const now = new Date();
  const rec = Object.assign(existing ? {...existing} : {cost:0}, {
    plantingId:x.p.id, date:today(), category: CAT_OF[x.kind] || x.cat || 'other',
    desc: x.kind === 'water' ? 'Patubig' : x.kind === 'pest' ? 'Check sa peste' : x.kind === 'spray' ? 'Pag-spray' : x.label,
    taskKey:x.key, taskType:x.kind, outcome, status: outcome === 'done' ? 'COMPLETED' : 'WAITING',
    doneAt: now.toISOString(), by: isWorker() ? 'trabahante' : 'admin', auto:true}, extra);
  upsert('activities', rec);
  return rec;
}
function wkDone(key, laborN){
  const x = findItem(key); if (!x) return;
  if (whoOf(x) === 'paid' && laborN === undefined) { laborAsk(key); return; }
  const extra = {};
  if (x.kind === 'fert') {
    const lines = x.fert || [];
    const parts = lines.map(l => ({l, n:fertNeed(x.p, l)}));
    extra.item = lines.map(l => l.name).filter(Boolean).join(' + ');
    const kg = parts.reduce((t, a) => t + (a.n.kg || 0), 0);
    if (kg) { extra.qty = round2(kg); extra.unit = 'kg'; }
    extra.notes = parts.map(a => `${a.l.name}: ${a.n.kg != null ? fmtKg(a.n.kg) + ' kg' : '—'}`).join('; ');
  }
  if (x.kind === 'water') extra.reason = '';
  if (x.kind === 'spray') {
    const o = x.order;
    Object.assign(extra, {item:o.product, ai:o.ai, target:o.target, phi:o.phi ?? null, rei:o.rei ?? null, fpa:o.fpa || '',
      qty: o.dose && o.tanks ? round2(o.dose * o.tanks) : null, unit:o.doseUnit || '', notes:`Dosage: ${o.doseText || ''}`});
  }
  recordItem(x, 'done', extra);
  if (laborN !== undefined) saveLabor(x, laborN);
  toast('✅ NAHUMAN NA — na-record');
  render();
}
function wkSkip(key){
  const x = findItem(key); if (!x) return;
  const reasons = x.kind === 'water' ? WATER_REASONS : SKIP_REASONS;
  modal(x.kind === 'water' ? 'Ngano wala mapatubigi?' : 'Ngano wala mahuman?', `<div class="wk-reasons">
    ${reasons.map(r => `<button class="bigbtn ${DONE_REASONS.includes(r) && x.kind === 'water' ? 'ghost' : 'yellow'}" onclick="wkSkipSave('${key}','${r}')">${r === 'NAULAN' ? '🌧️ ' : r === 'BASA PA ANG YUTA' ? '💧 ' : r === 'WALAY TUBIG' ? '🚱 ' : r.startsWith('UBAN') ? '✏️ ' : '⏸️ '}${r}</button>`).join('')}
    </div>`);
}
function wkSkipSave(key, reason){
  const x = findItem(key); if (!x) return;
  let note = '';
  if (reason === 'UBAN PANG RASON') { note = (prompt('Isulat ang rason (mubo lang):') || '').trim(); }
  closeModal();
  recordItem(x, 'skipped', {reason, notes:note});
  toast(x.kind === 'water' && DONE_REASONS.includes(reason) ? '✅ Na-check — dili kinahanglan patubig' : '🟡 Na-record ang rason');
  render();
}
function wkUndo(key){
  const rec = recByKey(key); if (!rec) return;
  if (!confirm('I-undo kini nga record?')) return;
  removeRec('activities', rec.id);
  const lab = db.activities.find(a => a.laborFor === 'labor:' + key); if (lab) removeRec('activities', lab.id);
  save(); render(); toast('Na-undo');
}

/* ---------- Photos: IndexedDB (sa cellphone) + upload sa GitHub sa sync ---------- */
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('farmTrackerPhotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function blobBuf(blob){ return blob.arrayBuffer ? blob.arrayBuffer() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(blob); }); }
async function photoPut(id, blob){ const val = {type:blob.type || 'image/jpeg', buf:await blobBuf(blob)}; const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('p', 'readwrite'); t.objectStore('p').put(val, id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function photoGet(id){ const d = await idbOpen(); return new Promise((res, rej) => { const r = d.transaction('p').objectStore('p').get(id); r.onsuccess = () => { const v = r.result; res(!v ? null : v.buf ? new Blob([v.buf], {type:v.type}) : v); }; r.onerror = () => rej(r.error); }); }
function compressImage(file, max = 1024, q = 0.7){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('compress failed')), 'image/jpeg', q);
    };
    img.onerror = () => rej(new Error('Dili mabasa ang litrato'));
    img.src = url;
  });
}
async function blobToB64(blob){ const b = new Uint8Array(await blobBuf(blob)); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
async function uploadPhotos(c){
  const pending = db.activities.filter(a => a.photo && a.photo.id && !a.photo.path);
  for (const a of pending) {
    const blob = await photoGet(a.photo.id); if (!blob) continue;
    const path = `photos/${a.photo.id}.jpg`;
    const r = await fetch(ghUrl(Object.assign({}, c, {path})), {method:'PUT', headers:{Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
      body:JSON.stringify({message:'Farm Tracker photo', content:await blobToB64(blob), branch:c.branch || 'main'})});
    if (r.ok || r.status === 422) { a.photo = Object.assign({}, a.photo, {path}); a.updatedAt = nowISO(); }
  }
  if (pending.length) persist();
}
async function showPhoto(actId){
  const a = db.activities.find(x => x.id === actId); if (!a || !a.photo) return;
  modal('📷 Litrato', '<p class="muted">Ginakuha ang litrato…</p>');
  try {
    let blob = await photoGet(a.photo.id);
    if (!blob && a.photo.path) {
      const c = cfg();
      const r = await fetch(ghUrl(Object.assign({}, c, {path:a.photo.path})) + '?ref=' + encodeURIComponent(c.branch || 'main'), {headers:{Authorization:'Bearer ' + c.token, Accept:'application/vnd.github.raw+json'}});
      if (r.ok) { blob = await r.blob(); photoPut(a.photo.id, blob).catch(() => {}); }
    }
    $('#m_body').innerHTML = blob ? `<img src="${URL.createObjectURL(blob)}" style="width:100%;border-radius:12px">` : '<p class="muted">Wala makit-an ang litrato (wala pa na-sync gikan sa cellphone nga nagkuha).</p>';
  } catch(e) { $('#m_body').innerHTML = `<p class="neg">${esc(e.message)}</p>`; }
}

/* ---------- Ulan / panahon (Open-Meteo, libre, kon naay location) ---------- */
const WX_KEY = 'farmTracker.wx.v1';
function wxCache(){ try { return JSON.parse(localStorage.getItem(WX_KEY)) || null; } catch(e){ return null; } }
async function fetchWeather(){
  const f = farmSet(); if (f.lat == null || f.lon == null || !navigator.onLine) return;
  const c = wxCache();
  if (c && c.lat === f.lat && c.lon === f.lon && Date.now() - c.at < 3 * 3600e3) return;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}&daily=precipitation_sum,precipitation_probability_max&past_days=1&forecast_days=2&timezone=auto`);
    if (!r.ok) return;
    const j = await r.json();
    localStorage.setItem(WX_KEY, JSON.stringify({at:Date.now(), lat:f.lat, lon:f.lon, days:j.daily.time, rain:j.daily.precipitation_sum, prob:j.daily.precipitation_probability_max}));
    if (state.view === 'work') render();
  } catch(e){}
}
function rainNote(){
  const c = wxCache(); if (!c || !c.days) return '';
  const i = c.days.indexOf(today()); if (i < 1) return '';
  const yest = c.rain[i - 1] || 0, now = c.rain[i] || 0, prob = c.prob ? c.prob[i] : null;
  let msg = `🌧️ Ulan gahapon: <b>${fmtN(yest, 1)} mm</b> · Karon: <b>${fmtN(now, 1)} mm</b>${prob != null ? ` (${prob}% tsansa)` : ''}`;
  if (yest + now >= 10) msg += '<br><b>Daghan ang ulan — susiha una ang yuta. Lagmit dili kinahanglan patubig.</b>';
  else if (prob != null && prob >= 70) msg += '<br>Basin mo-ulan karon — susiha una ang yuta ug ang panahon.';
  return `<div class="wk-rain">${msg}<div class="small muted">Gikan sa weather forecast (Open-Meteo). Ang kumot sa yuta gihapon ang basehan.</div></div>`;
}

function phiBlocks(day){
  const out = [];
  for (const p of db.plantings) {
    if (p.status === 'done') continue;
    db.activities.filter(a => a.plantingId === p.id && a.category === 'pesticide' && Number(a.phi) > 0).forEach(a => {
      const safe = addDays(a.date, Number(a.phi));
      if (safe > day) out.push(`${crop(p).emoji} ${esc(pName(p))}: AYAW SA PAG-HARVEST hangtod ${fmtD(safe)}`);
    });
  }
  return out;
}

/* =========================================================
   PARTEHANAY (profit sharing)
   Gross (benta) − Agente (X% sa gross) − Tanang gasto = NET
   Sinaligan: Y% sa NET sa iyang kaugalingong area (kon positibo)
   Tag-iya: NET − parte sa sinaligan
   ========================================================= */
const DEFAULT_AGENT_PCT = 10, DEFAULT_CT_PCT = 10;
function caretakersAll(){
  const recs = db.settings.filter(s => s.type === 'caretaker');
  const ids = new Set(recs.map(r => r.ctId));
  const legacy = ((settingRec('farm') || {}).caretakers || []).filter(c => !ids.has(c.id));
  return [...recs.map(r => ({id:r.ctId, name:r.name, phone:r.phone, pct:r.pct, removed:!!r.removed, order:r.order ?? 99})),
          ...legacy.map((c, i) => Object.assign({order:i}, c))].sort((a, b) => a.order - b.order || String(a.name).localeCompare(String(b.name)));
}
const caretakers = () => caretakersAll().filter(c => !c.removed);
/* Mga caretakerId sa tanom nga wala na ang ngalan (nawala tungod sa daang sync) */
function orphanCts(){
  const known = new Set(caretakersAll().map(c => c.id)), out = {};
  db.plantings.forEach(p => { if (p.caretakerId && !known.has(p.caretakerId)) (out[p.caretakerId] = out[p.caretakerId] || []).push(p); });
  return out;
}
const ctById = id => id ? caretakers().find(c => c.id === id) : null;
const agentPct = () => farmSet().agentPct ?? DEFAULT_AGENT_PCT;
const hvAgent = h => h.viaAgent === false ? 0 : (Number(h.total) || 0) * (h.agentPct ?? agentPct()) / 100;
const CT_CATS = ['irrigation', 'pest_monitoring', 'pesticide'];   // trabaho sa sinaligan (walay dugang bayad)

/* Ang general farm expenses (walay tanom) gi-bahin sa mga tanom nga aktibo
   niadtong petsaha, base sa area. */
function pWindow(p){
  const hv = db.harvests.filter(h => h.plantingId === p.id).map(h => h.date).sort();
  const start = addDays(p.datePlanted, -30);
  let end = addDays(p.datePlanted, (Number(p.days) || 60) + 30);
  if (hv.length && hv[hv.length - 1] > end) end = hv[hv.length - 1];
  return [start, end];
}
function genAlloc(pid){
  if (farmSet().genShare === false) return 0;
  if (!statsCache.has('__gen')) {                       // compute kausa para sa tanang tanom
    const out = {}, ps = db.plantings.filter(p => p.datePlanted).map(p => ({p, w:pWindow(p), ha:plantingHa(p) || 0}));
    for (const a of db.activities) {
      if (a.plantingId || !Number(a.cost)) continue;
      const act = ps.filter(x => a.date >= x.w[0] && a.date <= x.w[1]);
      if (!act.length) continue;
      const W = act.reduce((t, x) => t + x.ha, 0);
      act.forEach(x => out[x.p.id] = (out[x.p.id] || 0) + Number(a.cost) * (W ? x.ha / W : 1 / act.length));
    }
    statsCache.set('__gen', out);
  }
  return statsCache.get('__gen')[pid] || 0;
}
function farmTotals(filterFn = () => true){
  const ps = db.plantings.filter(filterFn);
  const t = {gross:0, agent:0, cost:0, net:0, ct:0, owner:0};
  ps.forEach(p => { const s = stats(p.id); t.gross += s.income; t.agent += s.agent; t.cost += s.cost + s.gen; t.net += s.net; t.ct += s.ctShare; });
  t.owner = t.net - t.ct;
  return t;
}

/* ---------- Partehanay view ---------- */
function shareRow(p){
  const s = stats(p.id), c = crop(p), paid = p.sharePaid;
  const final = p.status === 'done';
  const diff = paid ? round2(s.ctShare - paid.amount) : 0;
  return `<div class="card sh-card">
    <div class="pc-top" onclick="state.tab='summary';go('planting','${p.id}')" style="cursor:pointer"><span class="emoji">${c.emoji}</span>
      <div class="grow"><b>${esc(pName(p))}</b><div class="small muted">${areaLbl(p) || ''} · ${STATUS[p.status]}</div></div><span>›</span></div>
    <table class="tbl" style="margin-top:8px">
      <tr><td>Benta (gross)</td><td>${money(s.income)}</td></tr>
      <tr><td>− Agente (${fmtN(agentPct(), 1)}% sa gross)</td><td class="neg">${money(s.agent)}</td></tr>
      <tr><td>− Gasto sa tanom</td><td class="neg">${money(s.cost)}</td></tr>
      ${s.gen ? `<tr><td>− Parte sa general expenses</td><td class="neg">${money(s.gen)}</td></tr>` : ''}
      <tr><td><b>NET</b></td><td class="${s.net >= 0 ? 'pos' : 'neg'}"><b>${s.net < 0 ? '−' : ''}${money(Math.abs(s.net))}</b></td></tr>
      ${s.ct ? `<tr><td>👤 Parte ni ${esc(s.ct.name)} (${fmtN(s.ctPct, 1)}% sa net)</td><td style="color:var(--blue);font-size:16px">${money(s.ctShare)}</td></tr>` : ''}
      <tr><td>🏠 Imong parte (tag-iya)</td><td class="${s.owner >= 0 ? 'pos' : 'neg'}">${s.owner < 0 ? '−' : ''}${money(Math.abs(s.owner))}</td></tr>
    </table>
    ${s.net < 0 && s.ct ? `<p class="small muted">Lugi ang net, busa ₱0 ang parte sa sinaligan (dili sila moapil sa lugi).</p>` : ''}
    ${s.ct ? (paid
      ? `<div class="small" style="margin-top:6px">✅ Nabayran na ${money(paid.amount)} sa ${fmtD(paid.date)}${Math.abs(diff) >= 1 ? ` · <b class="${diff > 0 ? 'neg' : 'pos'}">${diff > 0 ? 'Kulang pa' : 'Sobra'} ${money(Math.abs(diff))}</b> (nausab ang records)` : ''}
         <button class="btn sm ghost" onclick="sharePaid('${p.id}', true)">↩︎</button></div>`
      : s.ctShare > 0 ? `<div class="btnrow" style="margin-bottom:0"><button class="btn sm" onclick="sharePaid('${p.id}')">💵 Markahi nga nabayran na (${money(s.ctShare)})</button>
         ${!final ? '<span class="small muted" style="align-self:center">Dili pa final — "Tapos na" pa ang status.</span>' : ''}</div>` : '') : ''}
  </div>`;
}
function sharePaid(pid, undo){
  const p = getP(pid); if (!p) return;
  if (undo) { if (!confirm('Tangtangon ang record sa pagbayad?')) return; delete p.sharePaid; }
  else { const s = stats(pid); if (!confirm(`I-record nga nabayran na si ${s.ct.name} og ${money(s.ctShare)}?`)) return; p.sharePaid = {date:today(), amount:round2(s.ctShare)}; }
  upsert('plantings', p); render();
}
function viewShare(){
  const f = farmSet(), cts = caretakers(), tot = farmTotals();
  const unalloc = sum(db.activities.filter(a => !a.plantingId), a => a.cost) - db.plantings.reduce((t, p) => t + stats(p.id).gen, 0);

  return `<h2 style="margin-top:0">💰 Partehanay</h2>
  <div class="card small">

    ${f.genShare === false ? 'Ang general expenses dili gi-apil sa partehanay (imo ra).' : 'Ang general farm expenses (walay tanom) gi-bahin sa mga tanom nga aktibo niadtong petsaha, base sa area.'}
    <div class="btnrow" style="margin-bottom:0"><button class="btn sm ghost" onclick="ctForm()">⚙️ Sinaligan, agente %, sweldo</button></div>
  </div>
  <div class="stats">

    ${stat('Agente', money(tot.agent))}
    ${stat('Tanang gasto', money(tot.cost + (unalloc > 0.5 ? unalloc : 0)))}
    ${stat('Parte sa sinaligan', money(tot.ct))}
    ${stat('🏠 Imong parte', money(ownerFinal), ownerFinal >= 0 ? 'pos' : 'neg')}
  </div>
  ${unalloc > 0.5 ? `<p class="small muted">Upod sa gasto ang ${money(unalloc)} nga general expenses nga walay tanom nga aktibo niadtong petsaha (imo ra).</p>` : ''}
  ${(!isWorker() && Object.keys(orphanCts()).length ? `<div class="alert warn" onclick="ctForm()" style="cursor:pointer"><div>⚠️ <b>${Object.keys(orphanCts()).length} ka sinaligan ang nawala ang ngalan</b> pero naa pa ang ilang tanom. <u>Pindota diri</u> aron ibalik.</div></div>` : '')}

  ${cts.map(c => sec(`👤 ${esc(c.name)}`, db.plantings.filter(p => p.caretakerId === c.id))).join('')}
  ${sec('🏠 Walay sinaligan (imo tanan)', db.plantings.filter(p => !ctById(p.caretakerId)))}
  <h2>🤝 Agente sa merkado</h2>
  <div class="card">${db.harvests.length ? [...db.harvests].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30).map(h => { const p = getP(h.plantingId);

async function recoverCtNames(){
  const c = cfg(), want = ctEdit.list.filter(x => x.orphan && !x.name).map(x => x.id);
  if (!want.length) { toast('Wala nay kulang nga ngalan'); return; }
  toast('Nangita sa GitHub history…');
  const h = {Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json'};
  const found = {};
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch || 'main')}&per_page=60`, {headers:h});
    if (!r.ok) throw new Error(await ghErr(r));
    for (const cm of await r.json()) {
      if (want.every(id => found[id])) break;
      const rr = await fetch(ghUrl(c) + '?ref=' + cm.sha, {headers:{...h, Accept:'application/vnd.github.raw+json'}});
      if (!rr.ok) continue;
      let d; try { d = JSON.parse(await rr.text()); } catch(e) { continue; }
      (d.settings || []).forEach(s => {
        (s.id === 'farm' ? (s.caretakers || []) : s.type === 'caretaker' ? [{id:s.ctId, name:s.name, phone:s.phone, pct:s.pct}] : [])
          .forEach(ct => { if (want.includes(ct.id) && ct.name && !found[ct.id]) found[ct.id] = ct; });
      });
    }
  } catch(e) { toast('Dili makapangita: ' + e.message); return; }
  let n = 0;
  ctEdit.list.forEach(x => { const f2 = found[x.id]; if (x.orphan && f2) { x.name = f2.name; x.phone = x.phone || f2.phone || ''; x.pct = f2.pct ?? x.pct; n++; } });
  ctRender();
  toast(n ? `✅ Nakit-an ${n} ka ngalan. Pindota ang I-save.` : 'Wala makit-i sa history. I-type na lang ang ngalan.');
}

/* ---------- Planting calculator ---------- */
// Typical spacing (cm), seeds per hill, and approx seeds per gram. Always check the seed pack.
const SPACING = {
  sweet_corn:{row:75, pl:25, sph:1, spg:6},    kalabasa:{row:200, pl:100, sph:2, spg:7},
  broccoli:{row:50, pl:40, sph:1, spg:300, tp:1}, cabbage:{row:50, pl:40, sph:1, spg:280, tp:1},
  green_onion:{row:20, pl:15, sph:2, spg:300, tp:1}, tomato:{row:100, pl:50, sph:1, spg:300, tp:1},
  eggplant:{row:100, pl:50, sph:1, spg:230, tp:1}, ampalaya:{row:200, pl:50, sph:2, spg:6},
  sitaw:{row:75, pl:30, sph:2, spg:8},          pechay:{row:20, pl:15, sph:1, spg:500, tp:1},
  pepper:{row:75, pl:50, sph:1, spg:160, tp:1},  other:{row:50, pl:30, sph:1, spg:null}
};
const fmtN = (n, d = 0) => (Number(n)||0).toLocaleString('en-PH', {maximumFractionDigits:d});
function calcPlan(o){
  if (o.mode !== 'area') return calcFromSeeds(o);
  const r = {};
  const row = +o.rowCm || 0, pl = +o.plCm || 0, sph = +o.sph || 1, allow = o.allow == null ? 10 : +o.allow;
  r.sqm = o.areaUnit === 'ha' ? +o.area * 10000 : o.areaUnit === 'sqm' ? +o.area : null;
  if (o.len > 0 && o.wid > 0 && row && pl) {
    r.rows = Math.floor(o.wid * 100 / row);
    r.perRow = Math.floor(o.len * 100 / pl);
    r.hills = r.rows * r.perRow;
  } else if (o.areaUnit === 'plants' && o.area) r.hills = Math.round(+o.area);
  else if (r.sqm && row && pl) r.hills = Math.floor(r.sqm * 10000 / (row * pl));
  if (!r.hills) return r;
  r.seeds = Math.ceil(r.hills * sph * (1 + allow / 100) - 1e-9);
  const spg = +o.spg || 0, pack = +o.pack || 0;
  if (spg) r.grams = r.seeds / spg;
  const perPack = o.packUnit === 'seeds' ? pack : o.packUnit === 'kg' ? pack * 1000 * spg : pack * spg;
  if (perPack > 0) { r.perPack = perPack; r.packs = Math.ceil(r.seeds / perPack); r.packsExact = r.seeds / perPack; }
  if (r.packs && +o.packPrice) r.cost = r.packs * +o.packPrice;
  if (o.tray > 0) r.trays = Math.ceil(r.seeds / o.tray);
  return r;
}
function calcFromSeeds(o){
  const r = {mode:'seed'};
  const packs = +o.packs || 0, spp = +o.spp || 0, germ = o.germ == null || o.germ === '' ? 100 : +o.germ;
  const row = +o.rowCm || 0, pl = +o.plCm || 0, ph = +o.sph || 1;
  if (!packs || !spp) return r;
  r.seeds = Math.round(packs * spp);
  r.grown = Math.floor(r.seeds * germ / 100 + 1e-9);
  // Transplant: 1 seed per cell, ang matubo amo ang seedlings. Direct seeding: binhi kada butho.
  r.hills = o.method === 'direct' ? Math.floor(r.seeds / ph + 1e-9) : Math.floor(r.grown / ph + 1e-9);
  r.plants = o.method === 'direct' ? r.grown : r.hills * ph;
  if (row && pl) { r.sqm = r.hills * (row / 100) * (pl / 100); r.rowM = r.sqm; }
  if (o.method !== 'direct' && o.tray > 0) r.trays = Math.ceil(r.seeds / o.tray);
  if (+o.packPrice) r.cost = packs * +o.packPrice;
  r.packs = packs;
  return r;
}
function calcSeedHtml(o, r){
  if (!r.seeds) return '<p class="small muted" style="margin:0">Ibutang ang pila ka pack/can kag pila ka seeds kada pack para ma-compute.</p>';
  const unitWord = o.packName || 'pack';
  const direct = o.method === 'direct';
  return `<table class="tbl">
    <tr><td>Total nga binhi</td><td>${fmtN(r.seeds)} ka binhi (${fmtN(r.packs, 2)} ka ${esc(unitWord)})</td></tr>
    <tr><td>Matubo (germination ${o.germ ?? 100}%)</td><td>${fmtN(r.grown)} ka ${direct ? 'tanom' : 'seedlings'}</td></tr>
    <tr><td>${direct ? `Pila ka butho (${o.sph || 1} ka binhi kada butho)` : `Pila ka butho matamnan (${o.sph || 1} kada butho)`}</td><td>${fmtN(r.hills)} ka butho</td></tr>
    ${r.sqm ? `<tr><td>Area nga matamnan</td><td style="color:var(--green);font-size:16px">${fmtN(r.sqm, 2)} sq.m${r.sqm >= 1000 ? `<br>(${fmtN(r.sqm/10000, 3)} ha)` : ''}</td></tr>` : '<tr><td colspan="2" class="small muted">Ibutang ang distance para makita ang area.</td></tr>'}
    ${r.trays ? `<tr><td>Seedling trays (${o.tray} cells)</td><td>${fmtN(r.trays)} ka tray</td></tr>` : ''}
    ${r.cost ? `<tr><td>Gasto sa binhi</td><td>${money(r.cost)}</td></tr>` : ''}
  </table>`;
}
function calcHtml(o, r){
  if (o.mode !== 'area') return calcSeedHtml(o, r);
  if (!r.hills) return '<p class="small muted" style="margin:0">Ibutang ang area (ukon length × width) kag ang distance para ma-compute.</p>';
  const unitWord = o.packUnit === 'seeds' ? 'pack' : (o.packName || 'pack');
  const rowsTxt = r.rows ? `<tr><td>Rows</td><td>${fmtN(r.rows)} ka rows × ${fmtN(r.perRow)} ka tanom</td></tr>` : '';
  return `<table class="tbl">
    ${r.sqm ? `<tr><td>Area</td><td>${fmtN(r.sqm, 2)} sq.m${r.sqm >= 1000 ? ` (${fmtN(r.sqm/10000, 3)} ha)` : ''}</td></tr>` : ''}
    ${rowsTxt}

    <tr><td>Binhi kinahanglan (+${o.allow ?? 10}% extra)</td><td>${fmtN(r.seeds)} ka binhi</td></tr>
    ${r.grams != null ? `<tr><td>Timbang sang binhi</td><td>${r.grams >= 1000 ? fmtN(r.grams/1000, 2) + ' kg' : fmtN(r.grams, 1) + ' g'}</td></tr>` : ''}
    ${r.packs ? `<tr><td>I-prepare</td><td style="color:var(--green);font-size:16px">${fmtN(r.packs)} ka ${esc(unitWord)}</td></tr>` : ''}
    ${r.trays ? `<tr><td>Seedling trays (${o.tray} cells)</td><td>${fmtN(r.trays)} ka tray</td></tr>` : ''}
    ${r.cost ? `<tr><td>Estimated gasto sa binhi</td><td>${money(r.cost)}</td></tr>` : ''}

}
function readCalcForm(){
  return {mode:v('f_mode'), packs:num('f_packs'), spp:num('f_spp'), germ:num('f_germ'), method:v('f_method'),
    area:num('f_area'), areaUnit:v('f_areaUnit'), len:num('f_len'), wid:num('f_wid'), rowCm:num('f_rowcm'), plCm:num('f_plcm'),
    sph:num('f_sph'), allow:num('f_allow'), spg:num('f_spg'), pack:num('f_pack'), packUnit:v('f_packUnit'), packName:v('f_packName').trim(),

function calcUpdate(src){
  if ((src === 'len' || src === 'wid') && num('f_len') > 0 && num('f_wid') > 0) {
    document.getElementById('f_area').value = round2(num('f_len') * num('f_wid'));
    document.getElementById('f_areaUnit').value = 'sqm';
  }
  const o = readCalcForm();
  const seedMode = o.mode !== 'area';
  document.querySelectorAll('.cm-seed').forEach(el => el.style.display = seedMode ? '' : 'none');
  document.querySelectorAll('.cm-area').forEach(el => el.style.display = seedMode ? 'none' : '');
  const tp = (SPACING[v('f_crop')] || {}).tp;
  $('#w_tray').style.display = (seedMode ? o.method !== 'direct' : tp) ? '' : 'none';
  $('#l_sph').firstChild.textContent = seedMode && o.method !== 'direct' ? 'Seedling kada butho' : 'Binhi kada butho';
  const res = calcPlan(o);
  if (seedMode && res.sqm) { document.getElementById('f_area').value = round2(res.sqm); document.getElementById('f_areaUnit').value = 'sqm'; }
  document.getElementById('calcOut').innerHTML = calcHtml(o, res);
  targetUpdate();
}

const stat = (l, val, cls='') => `<div class="stat ${cls}"><div class="l">${l}</div><div class="v">${val}</div></div>`;

function viewDash(){
  const cost = sum(db.activities, a => a.cost), inc = sum(db.harvests, h => h.total), agent = sum(db.harvests, hvAgent), net = inc - agent - cost;
  const gen = sum(db.activities.filter(a => !a.plantingId), a => a.cost);
  const ctTot = db.plantings.reduce((t, p) => t + stats(p.id).ctShare, 0);
  const alerts = getAlerts();
  const ps = [...db.plantings].sort((a,b) => (a.status==='done') - (b.status==='done') || (b.datePlanted||'').localeCompare(a.datePlanted||''));
  return `
  <div class="stats">
    ${stat('Total nga Benta', money(inc))}
    ${stat('Agente', money(agent))}
    ${stat('Tanang Gasto', money(cost))}
    ${stat(net >= 0 ? 'NET Ganansya' : 'NET Lugi', money(Math.abs(net)), net >= 0 ? 'pos' : 'neg')}
    ${ctTot ? stat('Parte sa sinaligan', money(ctTot)) : ''}
    ${ctTot ? stat('🏠 Imong parte', money(net - ctTot), net - ctTot >= 0 ? 'pos' : 'neg') : ''}
  </div>
  <div class="btnrow"><button class="btn sm ghost" onclick="go('share')">💰 Tan-awa ang Partehanay</button></div>
  ${gen ? `<p class="small muted">Upod na diri ang general farm expenses nga ${money(gen)} (wala gin-assign sa isa ka tanom).</p>` : ''}
  <h2>Buluhaton & Alerts</h2>
  ${alerts.length ? alerts.slice(0, 12).map(a => `<div class="alert ${a.lvl}" onclick="state.tab='${a.lvl==='info'||a.html.includes('late')?'schedule':'records'}';go('planting','${a.pid}')"><div>${a.html}</div></div>`).join('') + (alerts.length > 12 ? `<p class="small muted">+${alerts.length-12} pa</p>` : '')

}

function pCard(p){

  const pct = Math.max(0, Math.min(100, dap / (Number(p.days)||1) * 100));
  const harvested = s.hv.length > 0;
  return `<div class="card pcard" onclick="state.tab='records';go('planting','${p.id}')">
    <div class="pc-top"><span class="emoji">${c.emoji}</span>
      <div class="grow"><b>${esc(pName(p))}</b><div class="muted small">${esc(p.location||'')}${p.location && p.area ? ' · ' : ''}${areaLbl(p)}</div></div>
      <span class="chip st-${p.status}">${STATUS[p.status]||p.status}</span></div>
    ${p.status !== 'done' ? `<div class="bar"><i style="width:${pct}%"></i></div>
    <div class="small muted">${dap >= 0 ? `Day ${dap} (DAP)` : `${-dap} ka adlaw antes magtanom`} · Harvest ~${fmtD(addDays(p.datePlanted, Number(p.days)||0))}</div>` : ''}
    ${(() => { const tc = targetCalc(plantCount(p), p.target); if (!tc) return ''; const aq = sum(s.hv.filter(h => sameUnit(h.unit, p.target.unit)), h => h.qty);
      return `<div class="small" style="margin-top:6px">🎯 Target ${fmtN(tc.qty, tc.qty < 100 ? 1 : 0)} ${esc(UNIT_WORD[p.target.unit] || p.target.unit)}${tc.gross != null ? ` (${money(tc.gross)})` : ''} · na-harvest <b>${fmtN(Math.min(100, aq / tc.qty * 100), 0)}%</b></div>`; })()}
    <div class="pc-nums">${s.ct ? `<span>👤 ${esc(s.ct.name)}</span>` : ''}<span>Gasto <b>${money(s.allCost)}</b></span><span>Benta <b>${money(s.income)}</b></span>
      ${harvested || p.status === 'done'
        ? `<span class="${s.net>=0?'pos':'neg'}">${s.net>=0?'Ganansya':'Lugi'} <b>${money(Math.abs(s.net))}</b></span>`
        : `<span class="muted">Wala pa harvest</span>`}</div>
  </div>`;
}

function seedCard(p){
  if (!p.calc) return '';
  const o = Object.assign({}, p.calc, {area:p.area, areaUnit:p.areaUnit}), r = calcPlan(o);
  if (!r.hills && !r.seeds) return '';
  const hasSeedCost = db.activities.some(a => a.plantingId === p.id && a.category === 'seeds');
  const unitWord = o.mode !== 'area' ? (o.packName || 'pack') : o.packUnit === 'seeds' ? 'pack' : (o.packName || 'pack');
  const preset = JSON.stringify({plantingId:p.id, category:'seeds', desc:'Binhi', item:p.variety || '', qty:r.packs || null,
    unit:unitWord, unitCost:o.packPrice || null, cost:r.cost || null}).replace(/"/g, '&quot;');
  return `<details class="card" style="padding:12px 14px"><summary>🌰 Plano: ${fmtN(r.hills)} ka butho${r.sqm && r.mode === 'seed' ? ` · ${fmtN(r.sqm)} sq.m` : ''}${r.packs ? ` · ${fmtN(r.packs, 2)} ka ${esc(unitWord)} binhi` : ''}</summary>
    <div style="margin-top:8px">${calcHtml(o, r)}</div>
    ${!hasSeedCost && r.packs ? `<div class="btnrow" style="margin-bottom:0"><button class="btn sm" onclick="actForm(null, ${preset})">+ I-record ang binhi sa gasto</button></div>` : ''}
  </details>`;
}
function summaryHtml(p, s){
  const byCat = Object.assign({}, s.byCat); if (s.agent) byCat.agent = s.agent; if (s.gen) byCat.general = s.gen;
  const cats = Object.entries(byCat).filter(e => e[1] > 0).sort((a,b) => b[1]-a[1]);
  const CAT2 = {agent:{icon:'🤝', short:'Agente'}, general:{icon:'🏠', short:'General (parte)'}};
  const max = cats.length ? cats[0][1] : 1;
  const ha = areaHa(p);
  const rows = [
    ['Total nga Benta (gross)', money(s.income)],
    [`− Agente (${fmtN(agentPct(), 1)}% sa gross)`, money(s.agent)],
    ['− Gasto sa tanom', money(s.cost)],
    ...(s.gen ? [['− Parte sa general expenses', money(s.gen)]] : []),
    [s.net >= 0 ? '<b>NET Ganansya</b>' : '<b>NET Lugi</b>', `<span class="${s.net>=0?'pos':'neg'}"><b>${money(Math.abs(s.net))}</b></span>`],
    ...(s.ct ? [[`👤 Parte ni ${esc(s.ct.name)} (${fmtN(s.ctPct, 1)}%)`, money(s.ctShare)], ['🏠 Imong parte', `<span class="${s.owner>=0?'pos':'neg'}">${money(s.owner)}</span>`]] : []),
    ['ROI (Return on Investment)', s.roi == null ? '—' : `${round2(s.roi)}%`],
    ['Total nga Harvest', s.qty ? `${round2(s.qty)} ${esc(s.unit)}` : '—'],
    [`Gasto kada ${esc(s.unit)} (cost of production)`, s.qty ? money(s.allCost / s.qty) : '—'],
    [`Average nga presyo kada ${esc(s.unit)}`, s.qty ? money(s.income / s.qty) : '—'],
    [`Break-even nga presyo kada ${esc(s.unit)} (apil agente)`, s.qty ? money((s.cost + s.gen) / s.qty / (1 - agentPct() / 100)) : '—'],
  ];
  if (ha && s.qty) rows.push([`Yield kada hectare`, `${round2(s.qty / ha).toLocaleString('en-PH')} ${esc(s.unit)}`]);
  if (ha) rows.push(['Gasto kada hectare', money(s.cost / ha)]);
  let msg = '';
  if (!s.hv.length && p.status !== 'done') msg = `<p class="small muted">Wala pa harvest. Ang gasto subong ${money(s.cost)} — amo ini ang kinahanglan mabawi sa benta.</p>`;
  else msg = s.net >= 0
    ? `<div class="alert"><div>✅ <b>May ganansya</b> kamo nga ${money(s.net)} sa sini nga tanom.</div></div>`
    : `<div class="alert danger"><div>❌ <b>Lugi</b> kamo sang ${money(-s.net)}${p.status !== 'done' ? ' sa subong (puwede pa mabawi kon may harvest pa)' : ''}.</div></div>`;
  return `${msg}
    <div class="card"><table class="tbl">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    <h3>Diin napunta ang capital</h3>
    <div class="card">${cats.length ? cats.map(([k,a]) => `<div class="cbar"><span class="n">${(CATS[k]||CAT2[k])?.icon||''} ${esc((CATS[k]||CAT2[k])?.short||k)}</span><span class="t"><i style="width:${a/max*100}%"></i></span><span class="a">${money(a)}<br><span class="muted">${s.allCost ? Math.round(a/s.allCost*100) : 0}%</span></span></div>`).join('') : '<div class="empty">Wala pa gasto.</div>'}</div>
    <div class="btnrow"><button class="btn sm ghost" onclick="window.print()">🖨️ Print</button></div>`;
}

  if (a.category === 'pest_monitoring' && a.pest) bits.push(`${esc(a.pest)} (${esc(a.severity||'-')})`);
  if (a.category === 'pesticide' && a.phi) bits.push(`PHI ${a.phi}d`);
  if (a.reason) bits.push('🟡 ' + esc(a.reason));
  if (a.photo) bits.push('📷');
  if (a.by === 'trabahante') bits.push('👷');
  return `<div class="rowi" onclick="actForm('${a.id}')"><span class="ic">${c.icon}</span>

    <b class="${Number(a.cost) ? 'neg' : 'muted'}">${Number(a.cost) ? '-' + money(a.cost) : '—'}</b></div>`;

    <div style="text-align:right"><b class="pos">+${money(h.total)}</b>${hvAgent(h) ? `<div class="small neg">agente −${money(hvAgent(h))}</div>` : ''}</div></div>`;

function viewRecords(){
  const f = state.filter;
  let acts = db.activities, hv = db.harvests;
  if (f.pid === 'general') { acts = acts.filter(a => !a.plantingId); hv = []; }
  else if (f.pid !== 'all') { acts = acts.filter(a => a.plantingId === f.pid); hv = hv.filter(h => h.plantingId === f.pid); }
  if (f.cat === 'harvest') acts = [];
  else if (f.cat !== 'all') { acts = acts.filter(a => a.category === f.cat); hv = []; }
  const items = [...acts.map(r => ({t:'a', r})), ...hv.map(r => ({t:'h', r}))]
    .sort((x,y) => y.r.date.localeCompare(x.r.date) || (y.r.updatedAt||'').localeCompare(x.r.updatedAt||''));
  const cost = sum(acts, a => a.cost), inc = sum(hv, h => h.total);
  let html = '', curM = '';
  const months = {};
  items.forEach(it => { const m = it.r.date.slice(0,7); months[m] = months[m] || {c:0,i:0}; if (it.t==='a') months[m].c += Number(it.r.cost)||0; else months[m].i += Number(it.r.total)||0; });
  items.forEach(it => {
    const m = it.r.date.slice(0,7);
    if (m !== curM) { if (curM) html += '</div>'; curM = m;
      html += `<div class="month"><span>${fmtMonth(it.r.date)}</span><span><span class="neg">-${money(months[m].c)}</span>${months[m].i ? ` <span class="pos">+${money(months[m].i)}</span>` : ''}</span></div><div class="card">`; }
    html += it.t === 'a' ? actRow(it.r) : hvRow(it.r);
  });
  if (curM) html += '</div>';
  const pOpts = `<option value="all">Tanan</option><option value="general" ${f.pid==='general'?'selected':''}>General farm expenses</option>` +
    db.plantings.map(p => `<option value="${p.id}" ${f.pid===p.id?'selected':''}>${crop(p).emoji} ${esc(pName(p))}</option>`).join('');
  const cOpts = `<option value="all">Tanan</option><option value="harvest" ${f.cat==='harvest'?'selected':''}>🧺 Harvest / Benta</option>` +
    Object.entries(CATS).map(([k,c]) => `<option value="${k}" ${f.cat===k?'selected':''}>${c.icon} ${c.short}</option>`).join('');
  return `<div class="btnrow"><button class="btn sm" onclick="actForm()">+ Gasto / Activity</button><button class="btn sm ghost" onclick="hvForm()">+ Harvest / Benta</button></div>
    <div class="row2"><label>Tanom<select onchange="state.filter.pid=this.value;render()">${pOpts}</select></label>
    <label>Category<select onchange="state.filter.cat=this.value;render()">${cOpts}</select></label></div>
    <div class="stats" style="margin-top:12px">${stat('Gasto', money(cost))}${stat('Kita', money(inc))}${stat('Net', money(inc-cost), inc-cost >= 0 ? 'pos' : 'neg')}</div>
    ${items.length ? html : '<div class="card empty" style="margin-top:12px">Wala sang record.</div>'}`;
}

  const sec = (t, arr) => `<h3>${t}</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<details ${open?'open':''}><summary>${c.emoji} ${esc(c.name)}</summary>
    ${sec('🚜 Land Preparation', g.land)}${sec('🌱 Planting', g.plant)}${sec('🧪 Fertilizer', g.fert)}${sec('🐛 Pests & Diseases (para sa monitoring)', g.pests)}${sec('🧺 Harvest', g.harv)}</details>`;
}

    ${Object.keys(GUIDE).map(k => guideHtml(k, false)).join('')}
    <details><summary>🔍 Paano mag Pest Monitoring</summary><ul>

let modalSave = null, modalDel = null;
function modal(title, body, onSave, onDel){
  $('#m_title').textContent = title; $('#m_body').innerHTML = body;
  modalSave = onSave; modalDel = onDel;
  $('#m_foot').innerHTML = onSave ? `${onDel ? '<button class="btn red" style="flex:0 0 auto" onclick="modalDelClick()">🗑</button>' : ''}<button class="btn ghost" onclick="closeModal()">Kanselar</button><button class="btn" onclick="modalSaveClick()">I-save</button>` : '';
  $('#modal').classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); modalSave = modalDel = null; }
function modalSaveClick(){ if (modalSave && modalSave() !== false) { closeModal(); render(); } }
function modalDelClick(){ if (modalDel && confirm('Sigurado ka nga panason ini?')) { modalDel(); save(); closeModal(); render(); toast('Napanas na'); } }

  () => {
    if (!v('f_date')) { toast('Butangi sang petsa sang pagtanom'); return false; }
    const r = Object.assign(p, {crop:v('f_crop'), customName:v('f_customName').trim(), variety:v('f_variety').trim(), batch:v('f_batch').trim(),
      area:num('f_area'), areaUnit:v('f_areaUnit'), location:v('f_location').trim(), datePlanted:v('f_date'),
      days:num('f_days') ?? CROPS[v('f_crop')].days, status:v('f_status'), notes:v('f_notes'), caretakerId:v('f_ctId') || null});
    r.target = {per:num('f_tper'), unit:v('f_tunit'), mkt:num('f_tmkt'), price:num('f_tprice')};
    const co = readCalcForm(); delete co.area; delete co.areaUnit;
    r.calc = co;
    upsert('plantings', r); toast('Na-save ang tanom');
    if (!id) { state.tab = 'schedule'; go('planting', r.id); }
  },
  id ? () => {
    db.activities.filter(a => a.plantingId === id).forEach(a => removeRec('activities', a.id));
    db.harvests.filter(h => h.plantingId === id).forEach(h => removeRec('harvests', h.id));
    removeRec('plantings', id); go('plantings');
  } : null);
  cropChanged(true);
}
function cropChanged(init){
  const k = v('f_crop');
  $('#w_custom').style.display = k === 'other' ? '' : 'none';
  if (!init) {
    $('#f_days').value = CROPS[k].days;
    const d = SPACING[k] || SPACING.other;
    Object.entries({f_rowcm:d.row, f_plcm:d.pl, f_sph:d.tp ? 1 : d.sph, f_allow:d.tp ? 20 : 10, f_spg:d.spg ?? '', f_tray:d.tp ? 104 : '', f_method:d.tp ? 'transplant' : 'direct'})
      .forEach(([id, val]) => document.getElementById(id).value = val);
    const y = YIELD[k] || YIELD.other;
    document.getElementById('f_tper').value = y.per ?? ''; document.getElementById('f_tunit').value = y.unit; document.getElementById('f_tmkt').value = y.mkt;
  }
  calcUpdate();
}

  const sev = ['None','Low','Medium','High'].map(s => `<option ${a.severity===s?'selected':''}>${s}</option>`).join('');
  const meth = ['Basal','Sidedress','Foliar','Drench','Other'].map(s => `<option ${a.method===s?'selected':''}>${s}</option>`).join('');
  modal(id ? 'Edit Record' : 'Bag-o nga Gasto / Activity', `

    <div class="cx" data-c="pest_monitoring">
      <div class="row2"><label>Pest / Sakit nga nakit-an<input id="f_pest" value="${esc(a.pest||'')}" placeholder="hal. Fall armyworm"></label>
      <label>Severity<select id="f_sev">${sev}</select></label></div>
      <div class="row2"><label>% sang tanom nga apektado<input type="number" step="any" inputmode="decimal" id="f_pct" value="${a.pct??''}"></label>
      <label>Ginhimo (action)<input id="f_action" value="${esc(a.action||'')}" placeholder="hal. Handpick, spray"></label></div>
    </div>
    <div class="cx" data-c="pesticide">
      <div class="row2"><label>Active ingredient<input id="f_ai" value="${esc(a.ai||'')}"></label>

      <label>Target pest / sakit<input id="f_target" value="${esc(a.target||'')}"></label>
    </div>
    <div class="cx" data-c="fertilizer"><label>Method<select id="f_method">${meth}</select></label></div>
    <label>Item / Product<input id="f_item" value="${esc(a.item||'')}" placeholder="hal. Urea 46-0-0, 14-14-14"></label>
    <div class="row3"><label>Qty<input type="number" step="any" inputmode="decimal" id="f_qty" value="${a.qty??''}" oninput="calcTotal('f_qty','f_uc','f_cost')"></label>
    <label>Unit<input id="f_unit" list="units" value="${esc(a.unit||'')}" placeholder="kg, sack"></label>
    <label>Presyo kada unit (₱)<input type="number" step="any" inputmode="decimal" id="f_uc" value="${a.unitCost??''}" oninput="calcTotal('f_qty','f_uc','f_cost')"></label></div>
    <label>Total nga gasto (₱)<input type="number" step="any" inputmode="decimal" id="f_cost" value="${a.cost??''}"></label>
    <p class="hint" id="h_labor">Labor: Qty = man-days (tawo × adlaw), Presyo = sweldo kada adlaw.</p>
    <p class="hint" id="h_pm">Pest monitoring: puwede 0 ang gasto. Importante ang record para makita ang pattern.</p>
    <label>Notes<textarea id="f_notes">${esc(a.notes||'')}</textarea></label>
    ${a.doneAt ? `<p class="small muted">Gi-record sa ${esc(a.by || '')} · ${timeStr(a.doneAt)} · ${esc(a.status || '')}${a.reason ? ' · ' + esc(a.reason) : ''}</p>` : ''}
    ${a.photo ? `<button class="btn sm ghost" onclick="showPhoto('${a.id}')">📷 Tan-awa ang litrato</button>` : ''}
    <datalist id="units"><option>kg</option><option>sack</option><option>bag</option><option>L</option><option>mL</option><option>bottle</option><option>pack</option><option>pcs</option><option>man-day</option><option>hour</option><option>trip</option><option>tray</option></datalist>`,
  () => {
    if (!v('f_date')) { toast('Butangi sang petsa'); return false; }
    let cost = num('f_cost');
    if (cost == null && num('f_qty') != null && num('f_uc') != null) cost = round2(num('f_qty') * num('f_uc'));
    const cat = v('f_cat');
    const r = Object.assign(a, {plantingId:v('f_pid'), date:v('f_date'), category:cat, desc:v('f_desc').trim(), item:v('f_item').trim(),
      qty:num('f_qty'), unit:v('f_unit').trim(), unitCost:num('f_uc'), cost:cost || 0, notes:v('f_notes')});
    if (cat === 'pest_monitoring') Object.assign(r, {pest:v('f_pest').trim(), severity:v('f_sev'), pct:num('f_pct'), action:v('f_action').trim()});
