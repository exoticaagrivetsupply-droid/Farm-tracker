<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Tracker</title>
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f4f2ea;--card:#ffffff;--ink:#1e281e;--muted:#6b7266;--line:#e2ded2;
  --green:#2f6b3a;--green2:#e4efe0;--red:#b3261e;--red2:#fbe7e4;--amber:#9a6200;--amber2:#fff1d1;
  --blue:#245d8f;--blue2:#e3eef8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .sync{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}
.pos{color:var(--green)}.neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:20px;font-weight:700;margin-top:2px;word-break:break-word}
.stat.pos{background:var(--green2);border-color:#c5dbbf}.stat.neg{background:var(--red2);border-color:#f0c7c0}
.pcard{cursor:pointer}
.pc-top{display:flex;align-items:center;gap:10px}
.emoji{font-size:30px;line-height:1}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#eee;white-space:nowrap}
.st-planned{background:#ececec}.st-land_prep{background:var(--amber2);color:var(--amber)}
.st-growing{background:var(--green2);color:var(--green)}.st-harvesting{background:var(--blue2);color:var(--blue)}
.st-done{background:#e6e3da;color:#555}
.bar{height:6px;background:#ece9df;border-radius:6px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.pc-nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;cursor:pointer;background:var(--blue2)}
.alert.warn{background:var(--amber2)}.alert.danger{background:var(--red2)}
.rowi{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rowi:last-child{border-bottom:0}.rowi .ic{font-size:22px;width:28px;text-align:center}
.month{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 4px;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.sm{padding:7px 11px;font-size:13px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:#fff;border:1px solid #cfcabb;border-radius:10px;padding:10px}
textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}.check input{width:auto;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:130px;background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--muted);cursor:pointer}
nav button span{display:block;font-size:21px}nav button.on{color:var(--green);font-weight:700}
.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
.sheet-h b{flex:1}.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink)}
#m_body{padding:4px 16px 16px;overflow-y:auto}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}.sheet-f:empty{display:none}
.menu button{display:flex;width:100%;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.cbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.cbar .n{width:150px;flex-shrink:0}.cbar .t{flex:1;background:#ece9df;height:10px;border-radius:6px;overflow:hidden}
.cbar .t i{display:block;height:100%;background:var(--green)}.cbar .a{width:100px;text-align:right}
.task{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.task input{width:22px;height:22px;margin:0;flex-shrink:0}
.task.done .lbl{text-decoration:line-through;color:var(--muted)}
.task.late .due{color:var(--red);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
details summary{font-weight:700;cursor:pointer;font-size:16px}
details ul{padding-left:20px;margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}.tbl td:last-child{text-align:right;font-weight:600}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
@media(max-width:480px){.cbar .n{width:110px}.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:1/-1}}
@media print{header,nav,.fab,.btnrow,.tabs{display:none}main{padding:0}}
</style>
</head>
<body>
<header>
  <h1>🌱 Farm Tracker</h1>
  <button class="sync" id="installBtn" style="display:none" onclick="installApp()">📲 Install</button>
  <button class="sync" id="syncBtn" onclick="syncNow()">☁ Sync</button>
</header>
<main id="main"></main>
<button class="fab" onclick="addMenu()" aria-label="Add">+</button>
<nav id="nav"></nav>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-h"><b id="m_title"></b><button class="x" onclick="closeModal()">✕</button></div>
    <div id="m_body"></div>
    <div class="sheet-f" id="m_foot"></div>
  </div>
</div>
<div id="toast"></div>

<script>

const CATS = {
  land_prep:      {name:'Land Prep (Pag-preparar sang duta)', short:'Land Prep', icon:'🚜'},
  seeds:          {name:'Seeds / Seedlings (Binhi)', short:'Binhi', icon:'🌰'},
  planting:       {name:'Planting / Transplanting', short:'Planting', icon:'🌱'},

    [-7,'land_prep','Harrowing & furrowing (75 cm between rows)','Harrow 1–2x tubtob mabuhagay ang duta. Himua ang furrows nga 75 cm ang layo. Kon may bakilid, tabok sa bakilid ang furrows para indi ma-anod ang duta.'],

    [0,'planting','Planting + basal fertilizer','Ibutang ang basal fertilizer sa furrow, tabuni anay sang manipis nga duta antes ibutang ang binhi para indi ma-sunog. 1–2 ka binhi kada butho, 20–25 cm ang layo, 2–3 cm kadalom. I-record: binhi, abono, labor.'],
    [7,'pest_monitoring','Check germination, replant missing hills','Lakta ang rows. Ang butho nga wala nagtubo, tamni liwat dayon (antes mag-10 DAP para pareho ang tubo). Lantawa man kon may cutworm (utod sa punoan).'],

    [14,'pest_monitoring','Scout fall armyworm sa whorl','Check 20 ka tanom sa lain-lain nga bahin. Lantawa ang whorl: butho sa dahon kag ipot (frass) = fall armyworm. I-record pila ka tanom ang may damage. Kon damo na, pamangkot sa agriculturist sang recommended nga kontrol.'],
    [25,'fertilizer','1st sidedress (Nitrogen) + hilling-up','Ibutang ang abono 5–10 cm halin sa punoan, dayon tabuni sang duta (hilling-up) para indi mag-alisngaw ang nitrogen kag para mabakod ang tanom. Mas maayo kon basa-basa ang duta.'],
    [30,'weeding','Weeding / off-barring','Limpyuhi ang hilamon sa tunga sang rows. Indi pag-ugot ang gamot sang mais.'],
    [45,'fertilizer','2nd sidedress before tasseling','Pareho sa 1st sidedress: 5–10 cm halin sa punoan, tabuni. Importante ini antes mag-gwa ang tassel para dalagko ang uhay.'],

    [-7,'fertilizer','Compost / organic kada hill','Butangi sang 1–2 ka pala nga dunot nga compost/manure kada hill kag isagol sa duta.'],
    [0,'planting','Planting (2–3 seeds/hill) + basal fertilizer','Ibutang ang basal fertilizer sa hill kag tabuni anay sang duta. 2–3 ka binhi kada hill, 2–3 cm kadalom. Bisbisi kon uga ang duta.'],
    [7,'pest_monitoring','Check germination, replant','Ang hill nga wala nagtubo, tamni liwat. Lantawa kon may squash beetle (orange nga sapat) sa bata pa nga dahon.'],

    [28,'fertilizer','Sidedress Nitrogen sa vine run','Kon nagasugod na magkamang ang bagon: ibutang ang abono palibot sang hill (indi sa punoan mismo), tabuni sang duta. Mag-mulch kon may dagami.'],
    [45,'pest_monitoring','Flowering: check fruit set & fruit fly','Lantawa kon may bunga nga nagaporma. Kon madamo bulak pero wala bunga, hand-pollinate sa aga (6–9 AM): ipahid ang pollen sang lalaki nga bulak sa babaye nga bulak (ang may gamay nga bunga sa idalom). Butangi sang fruit fly traps.'],
    [55,'fertilizer','Sidedress Potash para sa bunga','Ibutang ang potash palibot sang hill kag tabuni. Butangi sang dagami ukon karton ang idalom sang bunga para indi madunot.'],
    ['H','harvest_cost','Harvest (matig-a na ang panit, uga na ang tangkay)','Matig-a na ang panit (indi ma-dent sang kuko) kag uga na ang tangkay. Utdon nga may 3–5 cm nga tangkay. I-check anay ang PHI sang spray.']

  broccoli: [
    [-30,'seeds','Sow seeds sa seedbed / seedling trays','Gamit sang buhagay nga media (garden soil + compost ukon carbonized rice hull). 1 ka binhi kada cell. Butangi sang atop (net/plastic) kontra init kag ulan. Bisbisi aga kag hapon pero diutay lang.'],
    [-14,'land_prep','Plowing','Arado mga 20–25 cm. Kon acidic ang duta (pH ubos sa 6), plano na ang lime.'],
    [-7,'land_prep','Harrowing + raised beds (lime kon acidic)','Harrow kag himua ang raised beds (20–30 cm ka taas) para indi malunang. Isablig ang lime kag compost kag isagol sa duta.'],
    [0,'planting','Transplant + basal fertilizer','Transplant sa hapon ukon sa madulom nga adlaw. Ibutang ang basal fertilizer sa butho kag tabuni anay antes ibutang ang seedling. Spacing 50 × 40–50 cm. Bisbisi dayon.'],
    [7,'planting','Replace dead seedlings','Ilisi ang napatay nga seedlings halin sa sobra sa trays. Lantawa kon may cutworm (utod sa punoan sa gab-i).'],
    [10,'pest_monitoring','Scout diamondback moth & cutworm','Check 20 ka tanom: lantawa ang idalom sang dahon kon may gagmay nga berde nga uod (DBM) kag "window" nga butho. I-record ang % apektado.'],
    [14,'fertilizer','1st sidedress Nitrogen + weeding','Gabuta anay ang hilamon, dayon ibutang ang abono 5–10 cm halin sa punoan kag tabuni. Bisbisi kon uga.'],
    [30,'fertilizer','2nd sidedress (+ boron kon kinahanglan)','Pareho sa 1st sidedress. Kon may hollow stem sa nagligad nga tanom, pamangkot sa agriculturist parte sa boron.'],
    [45,'pest_monitoring','Check head formation & webworm','Lantawa ang tunga sang tanom (growing point) kon may webworm. Siguroha nga indi kulang ang tubig samtang nagaporma ang head.'],
    ['H','harvest_cost','Harvest (compact ang head, wala pa yellow flowers)','Compact pa ang head kag dark green ang buds — indi paghulaton nga mag-yellow. Utdon sa aga nga may 10–15 cm nga tangkay kag ibutang dayon sa landong. I-check anay ang PHI.']

    [30,'fertilizer','2nd sidedress Nitrogen','Pareho: gamay nga nitrogen sa tunga sang rows, dayon bisbisi.'],
    [45,'pest_monitoring','Check purple blotch / leaf spots','Lantawa ang dahon kon may purple/brown nga spots. Kon tig-ulan, likawi nga basa permi ang beds.'],
    ['H','harvest_cost','Harvest (30–45 cm ang taas)','Gabuta ukon utdon kon 30–45 cm na ang taas. Hugasi, bugkusa, kag ibutang sa landong. I-check anay ang PHI.']

  tomato: [
    [-28,'seeds','Sow seeds sa seedling trays','Trays nga may buhagay nga media, may atop. 1 ka binhi kada cell. Bisbisi diutay lang aga kag hapon.'],
    [-14,'land_prep','Plowing','Arado 20–25 cm. Indi pagtanom sa lugar nga gintamnan sang talong, sili, ukon kamatis sang nagligad nga season (bacterial wilt).'],

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? parseD(s).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'}) : '';
const fmtMonth = s => parseD(s).toLocaleDateString('en-PH', {month:'long', year:'numeric'});
const money = n => '₱' + (Number(n)||0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const sum = (arr, f) => arr.reduce((t, x) => t + (Number(f(x)) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const num = id => { const s = v(id); if (s === '' || s == null) return null; const n = parseFloat(s); return isNaN(n) ? null : n; };

/* ---------- Data ---------- */
const emptyDb = () => ({plantings:[], activities:[], harvests:[], deleted:{}});
function loadDb(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.plantings)) return Object.assign(emptyDb(), d); } catch(e){}
  return emptyDb();
}
let db = loadDb();
function cfg(){ try { return JSON.parse(localStorage.getItem(CFG)) || {}; } catch(e){ return {}; } }
function setCfg(c){ localStorage.setItem(CFG, JSON.stringify(c)); }

function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function save(){
  persist();
  const c = cfg(); c.dirty = true; setCfg(c);
  updateSyncBtn();
  if (c.auto && c.token) { clearTimeout(save._t); save._t = setTimeout(() => syncNow(true), 4000); }
}
function upsert(coll, rec){
  rec.updatedAt = nowISO();
  if (!rec.id) { rec.id = uid(); rec.createdAt = rec.updatedAt; }
  const arr = db[coll]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  save(); return rec;
}
function removeRec(coll, id){
  db[coll] = db[coll].filter(x => x.id !== id);
  db.deleted[id] = nowISO();
}

/* Merge two copies (this phone + GitHub). Newer edit wins; deletions are remembered. */
function mergeDb(a, b){
  const out = emptyDb();
  out.deleted = Object.assign({}, a.deleted || {});
  for (const [k, t] of Object.entries((b && b.deleted) || {})) if (!out.deleted[k] || t > out.deleted[k]) out.deleted[k] = t;
  for (const c of ['plantings','activities','harvests']) {
    const m = new Map();
    for (const r of [...(a[c]||[]), ...((b && b[c])||[])]) {
      const e = m.get(r.id);
      if (!e || (r.updatedAt||'') > (e.updatedAt||'')) m.set(r.id, r);
    }
    out[c] = [...m.values()].filter(r => !(out.deleted[r.id] && out.deleted[r.id] >= (r.updatedAt||'')));
  }
  return out;
}

/* ---------- Domain ---------- */
const crop = p => CROPS[p.crop] || CROPS.other;
const pName = p => (p.crop === 'other' && p.customName ? p.customName : crop(p).name.split(' (')[0]) + (p.variety ? ` – ${p.variety}` : '') + (p.batch ? ` (${p.batch})` : '');
const getP = id => db.plantings.find(p => p.id === id);
const areaLbl = p => p.area ? `${p.area} ${p.areaUnit === 'ha' ? 'ha' : p.areaUnit === 'sqm' ? 'sq.m' : (p.areaUnit||'')}` : '';
const areaHa = p => !p.area ? null : p.areaUnit === 'ha' ? +p.area : p.areaUnit === 'sqm' ? +p.area / 10000 : null;

function stats(pid){
  const acts = db.activities.filter(a => a.plantingId === pid);
  const hv = db.harvests.filter(h => h.plantingId === pid);
  const cost = sum(acts, a => a.cost), income = sum(hv, h => h.total);
  const byCat = {}; acts.forEach(a => byCat[a.category] = (byCat[a.category]||0) + (Number(a.cost)||0));
  const units = {}; hv.forEach(h => { const u = h.unit || 'kg'; units[u] = (units[u]||0) + (Number(h.qty)||0); });
  const unit = Object.keys(units).sort((x,y) => units[y]-units[x])[0] || 'kg';
  return {acts, hv, cost, income, net: income - cost, roi: cost ? (income - cost) / cost * 100 : null, byCat, units, unit, qty: units[unit] || 0};
}

function schedule(p){
  const tpl = TASKS[p.crop] || TASKS.other, done = p.done || {};
  return tpl.map((t, i) => {
    const off = t[0] === 'H' ? (Number(p.days)||0) : t[0];
    return {i, off, cat:t[1], label:t[2], how:t[3]||'', due:addDays(p.datePlanted, off), done:done[i]};
  });
}

function getAlerts(){
  const out = [], t = today();
  for (const p of db.plantings) {
    if (p.status === 'done' || !p.datePlanted) continue;
    const c = crop(p), nm = `${c.emoji} <b>${esc(pName(p))}</b>`;
    // pesticide pre-harvest interval
    db.activities.filter(a => a.plantingId === p.id && a.category === 'pesticide' && Number(a.phi) > 0).forEach(a => {
      const safe = addDays(a.date, Number(a.phi));
      if (safe > t) out.push({lvl:'danger', sort:-200, pid:p.id, html:`⚠️ ${nm}: Ayaw anay mag-harvest tubtob <b>${fmtD(safe)}</b> (PHI sang ${esc(a.item || 'spray')})`});
    });
    // pest monitoring
    if (['growing','harvesting'].includes(p.status)) {
      const mons = db.activities.filter(a => a.plantingId === p.id && a.category === 'pest_monitoring').sort((x,y) => x.date.localeCompare(y.date));
      const last = mons[mons.length-1];
      if (last && last.severity === 'High' && diffDays(last.date, t) <= 7)
        out.push({lvl:'danger', sort:-150, pid:p.id, html:`🐛 ${nm}: HIGH nga pest/disease — ${esc(last.pest || '')} (${fmtD(last.date)})`});
      if (!last || diffDays(last.date, t) > 7)
        out.push({lvl:'warn', sort:-100, pid:p.id, html:`🔍 ${nm}: Wala pa pest monitoring ${last ? 'kutob ' + fmtD(last.date) : ''} — mag-scout na`});
    }
    // schedule tasks
    for (const s of schedule(p)) {
      if (s.done) continue;
      const d = diffDays(t, s.due);
      if (d <= 7 && d >= -14) out.push({lvl: d < 0 ? 'warn' : 'info', sort:d, pid:p.id,
        html:`${CATS[s.cat]?.icon || '📌'} ${nm}: ${esc(s.label)} — ${d < 0 ? `<b>${-d} ka adlaw late</b>` : d === 0 ? '<b>subong nga adlaw</b>' : `sa ${d} ka adlaw`}`});
    }
  }
  return out.sort((a,b) => a.sort - b.sort);
}

/* ---------- Today / Tomorrow ---------- */
const MULTI_PICK = ['tomato','eggplant','ampalaya','sitaw','pepper','kalabasa'];
function scoutInterval(p, dap){
  if (p.crop === 'sweet_corn' && dap <= 40) return 3;      // fall armyworm: 2x/week sa una
  if (['broccoli','cabbage','tomato'].includes(p.crop)) return 4;
  return 7;
}
function scoutHow(p){
  const g = GUIDE[p.crop];
  const pests = g ? g.pests.map(x => x.split(' — ')[0].replace(/\.$/,'')).filter(x => !x.startsWith('Sakit') && !x.startsWith('Kon ')).slice(0,4).join(', ') : 'uod, sapat, kag sakit sa dahon';
  return `Lakat sa uma nga pa-Z. Check 20 ka tanom sa lain-lain nga bahin. Lantawa: ${pests}. I-record sa app ang nakit-an — bisan wala, i-record nga "None".`;
}
function dailyTasks(){
  const t = today(), tm = addDays(t, 1), items = [];
  for (const p of db.plantings) {
    if (p.status === 'done' || !p.datePlanted) continue;
    const dap = diffDays(p.datePlanted, t);
    const mine = [];
    for (const s of schedule(p)) {
      if (s.done || s.due > tm || diffDays(s.due, t) > 21) continue;
      mine.push({kind:'task', p, i:s.i, day: s.due <= t ? 'today' : 'tomorrow', late: s.due < t, lateDays: diffDays(s.due, t),
        label:s.label, how:s.how, cat:s.cat, due:s.due, off:s.off});
    }
    // weekly / 2x-a-week pest scouting once the crop is in the ground
    if (dap >= 7 && p.status !== 'planned') {
      const mons = db.activities.filter(a => a.plantingId === p.id && a.category === 'pest_monitoring').map(a => a.date).sort();
      const last = mons[mons.length-1];
      const next = last ? addDays(last, scoutInterval(p, dap)) : t;
      const day = next <= t ? 'today' : next === tm ? 'tomorrow' : null;
      if (day && !mine.some(m => m.cat === 'pest_monitoring' && m.day === day))
        mine.push({kind:'scout', p, day, late: next < t && !!last, lateDays: diffDays(next, t), cat:'pest_monitoring',
          label:'Pest monitoring (scouting)', how: scoutHow(p) + (last ? ` Last monitoring: ${fmtD(last)}.` : '')});
    }
    // repeated picking for crops harvested many times
    if (p.status === 'harvesting' && MULTI_PICK.includes(p.crop)) {
      const hs = db.harvests.filter(h => h.plantingId === p.id).map(h => h.date).sort();
      const last = hs[hs.length-1];
      const next = last ? addDays(last, 3) : t;
      const day = next <= t ? 'today' : next === tm ? 'tomorrow' : null;
      if (day) mine.push({kind:'pick', p, day, late:false, cat:'harvest_cost', label:'Pamupo / harvest',
        how:'Pamupoa ang hinog na. Ihaw-ihaw ang maayo kag reject. I-record ang kilo kag presyo sa app.' + (last ? ` Last harvest: ${fmtD(last)}.` : '')});
    }
    items.push(...mine);
  }
  const order = {land_prep:1, seeds:2, planting:3, fertilizer:4, pesticide:5, pest_monitoring:6, weeding:7, materials:8, harvest_cost:9};
  items.sort((a,b) => (b.late - a.late) || ((order[a.cat]||9) - (order[b.cat]||9)));
  return {today: items.filter(x => x.day === 'today'), tomorrow: items.filter(x => x.day === 'tomorrow')};
}
function phiBlocks(day){
  const out = [];
  for (const p of db.plantings) {
    if (p.status === 'done') continue;
    db.activities.filter(a => a.plantingId === p.id && a.category === 'pesticide' && Number(a.phi) > 0).forEach(a => {
      const safe = addDays(a.date, Number(a.phi));
      if (safe > day) out.push(`${crop(p).emoji} ${esc(pName(p))}: ayaw anay mag-harvest tubtob ${fmtD(safe)}`);
    });
  }
  return out;
}
function taskCard(x){
  const c = crop(x.p), cat = CATS[x.cat] || CATS.other;
  let btns = '';
  if (x.kind === 'task') btns = `<button class="btn sm" onclick="toggleTask('${x.p.id}',${x.i})">✓ Nahimo na</button>
      <button class="btn sm ghost" onclick="logTask('${x.p.id}',${x.i})">+ I-record ang gasto</button>`;
  else if (x.kind === 'scout') btns = `<button class="btn sm" onclick="actForm(null,{plantingId:'${x.p.id}',category:'pest_monitoring',desc:'Weekly scouting'})">🔍 I-record ang nakit-an</button>`;
  else btns = `<button class="btn sm" onclick="hvForm(null,{plantingId:'${x.p.id}'})">🧺 I-record ang harvest</button>`;
  const when = x.late ? `<span class="chip" style="background:var(--red2);color:var(--red)">${x.lateDays} ka adlaw late</span>` : '';
  return `<div class="card" style="${x.late ? 'border-color:#f0c7c0' : ''}">
    <div class="pc-top"><span class="emoji" style="font-size:26px">${cat.icon}</span>
      <div class="grow"><b>${esc(x.label)}</b>
      <div class="small muted">${c.emoji} ${esc(pName(x.p))}${x.p.location ? ' · ' + esc(x.p.location) : ''}${x.kind === 'task' ? ` · Day ${x.off}` : ''}</div></div>${when}</div>
    ${x.how ? `<p class="small" style="margin:10px 0 0">${esc(x.how)}</p>` : ''}
    <div class="btnrow" style="margin-bottom:0">${btns}</div></div>`;
}
function viewToday(){
  const t = today(), tm = addDays(t, 1);
  const {today: td, tomorrow: tmr} = dailyTasks();
  const dname = s => parseD(s).toLocaleDateString('en-PH', {weekday:'long', month:'long', day:'numeric'});
  const blocks = phiBlocks(t);
  if (!db.plantings.length) return `<div class="card empty">Wala pa sang tanom.<br>Idugang anay ang inyo tanom para makita ang buluhaton kada adlaw.<br><br><button class="btn" onclick="plantingForm()">+ Magdugang sang Tanom</button></div>`;
  return `
  <div class="btnrow" style="margin-top:0;justify-content:space-between;align-items:center">
    <div><b style="font-size:18px">📋 Subong: ${dname(t)}</b></div>
    <button class="btn sm ghost" onclick="shareTasks()">📤 I-share sa trabahador</button></div>
  ${blocks.length ? `<div class="alert danger"><div>⚠️ <b>PHI — indi pa puwede mag-harvest:</b><br>${blocks.join('<br>')}</div></div>` : ''}
  ${td.length ? td.map(taskCard).join('') : '<div class="card empty">✅ Wala sang buluhaton subong. Pahuway anay ukon lakat-lakat sa uma.</div>'}
  <h2>🌅 Ugma: ${dname(tm)}</h2>
  ${tmr.length ? tmr.map(taskCard).join('') : '<div class="card empty">Wala pa sang naka-schedule para ugma.</div>'}
  <p class="small muted">Ang buluhaton halin sa schedule sang kada tanom (petsa sang pagtanom/transplant). Kon nahimo na, pindota ang "✓ Nahimo na" kag i-record ang gasto para ma-compute ang capital.</p>`;
}
function shareTasks(){
  const t = today(), tm = addDays(t, 1), {today: td, tomorrow: tmr} = dailyTasks();
  const line = x => `• ${crop(x.p).emoji} ${pName(x.p)}: ${x.label}${x.late ? ' (LATE)' : ''}\n  ${x.how}`;
  const text = `BULUHATON SUBONG (${fmtD(t)})\n${td.length ? td.map(line).join('\n') : '• Wala'}\n\nUGMA (${fmtD(tm)})\n${tmr.length ? tmr.map(line).join('\n') : '• Wala'}`;
  if (navigator.share) navigator.share({title:'Buluhaton sa Uma', text}).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Na-copy. I-paste sa Messenger/text.'), () => toast('Indi ma-copy'));

/* ---------- Planting calculator ---------- */
// Typical spacing (cm), seeds per hill, and approx seeds per gram. Always check the seed pack.
const SPACING = {
  sweet_corn:{row:75, pl:25, sph:1, spg:6},    kalabasa:{row:200, pl:100, sph:2, spg:7},
  broccoli:{row:50, pl:40, sph:1, spg:300, tp:1}, cabbage:{row:50, pl:40, sph:1, spg:280, tp:1},
  green_onion:{row:20, pl:15, sph:2, spg:300, tp:1}, tomato:{row:100, pl:50, sph:1, spg:300, tp:1},
  eggplant:{row:100, pl:50, sph:1, spg:230, tp:1}, ampalaya:{row:200, pl:50, sph:2, spg:6},
  sitaw:{row:75, pl:30, sph:2, spg:8},          pechay:{row:20, pl:15, sph:1, spg:500, tp:1},
  pepper:{row:75, pl:50, sph:1, spg:160, tp:1},  other:{row:50, pl:30, sph:1, spg:null}
};
const fmtN = (n, d = 0) => (Number(n)||0).toLocaleString('en-PH', {maximumFractionDigits:d});
function calcPlan(o){
  if (o.mode !== 'area') return calcFromSeeds(o);
  const r = {};
  const row = +o.rowCm || 0, pl = +o.plCm || 0, sph = +o.sph || 1, allow = o.allow == null ? 10 : +o.allow;
  r.sqm = o.areaUnit === 'ha' ? +o.area * 10000 : o.areaUnit === 'sqm' ? +o.area : null;
  if (o.len > 0 && o.wid > 0 && row && pl) {
    r.rows = Math.floor(o.wid * 100 / row);
    r.perRow = Math.floor(o.len * 100 / pl);
    r.hills = r.rows * r.perRow;
  } else if (o.areaUnit === 'plants' && o.area) r.hills = Math.round(+o.area);
  else if (r.sqm && row && pl) r.hills = Math.floor(r.sqm * 10000 / (row * pl));
  if (!r.hills) return r;
  r.seeds = Math.ceil(r.hills * sph * (1 + allow / 100) - 1e-9);
  const spg = +o.spg || 0, pack = +o.pack || 0;
  if (spg) r.grams = r.seeds / spg;
  const perPack = o.packUnit === 'seeds' ? pack : o.packUnit === 'kg' ? pack * 1000 * spg : pack * spg;
  if (perPack > 0) { r.perPack = perPack; r.packs = Math.ceil(r.seeds / perPack); r.packsExact = r.seeds / perPack; }
  if (r.packs && +o.packPrice) r.cost = r.packs * +o.packPrice;
  if (o.tray > 0) r.trays = Math.ceil(r.seeds / o.tray);
  return r;
}
function calcFromSeeds(o){
  const r = {mode:'seed'};
  const packs = +o.packs || 0, spp = +o.spp || 0, germ = o.germ == null || o.germ === '' ? 100 : +o.germ;
  const row = +o.rowCm || 0, pl = +o.plCm || 0, ph = +o.sph || 1;
  if (!packs || !spp) return r;
  r.seeds = Math.round(packs * spp);
  r.grown = Math.floor(r.seeds * germ / 100 + 1e-9);
  // Transplant: 1 seed per cell, ang matubo amo ang seedlings. Direct seeding: binhi kada butho.
  r.hills = o.method === 'direct' ? Math.floor(r.seeds / ph + 1e-9) : Math.floor(r.grown / ph + 1e-9);
  r.plants = o.method === 'direct' ? r.grown : r.hills * ph;
  if (row && pl) { r.sqm = r.hills * (row / 100) * (pl / 100); r.rowM = r.sqm; }
  if (o.method !== 'direct' && o.tray > 0) r.trays = Math.ceil(r.seeds / o.tray);
  if (+o.packPrice) r.cost = packs * +o.packPrice;
  r.packs = packs;
  return r;
}
function calcSeedHtml(o, r){
  if (!r.seeds) return '<p class="small muted" style="margin:0">Ibutang ang pila ka pack/can kag pila ka seeds kada pack para ma-compute.</p>';
  const unitWord = o.packName || 'pack';
  const direct = o.method === 'direct';
  return `<table class="tbl">
    <tr><td>Total nga binhi</td><td>${fmtN(r.seeds)} ka binhi (${fmtN(r.packs, 2)} ka ${esc(unitWord)})</td></tr>
    <tr><td>Matubo (germination ${o.germ ?? 100}%)</td><td>${fmtN(r.grown)} ka ${direct ? 'tanom' : 'seedlings'}</td></tr>
    <tr><td>${direct ? `Pila ka butho (${o.sph || 1} ka binhi kada butho)` : `Pila ka butho matamnan (${o.sph || 1} kada butho)`}</td><td>${fmtN(r.hills)} ka butho</td></tr>
    ${r.sqm ? `<tr><td>Area nga matamnan</td><td style="color:var(--green);font-size:16px">${fmtN(r.sqm, 2)} sq.m${r.sqm >= 1000 ? `<br>(${fmtN(r.sqm/10000, 3)} ha)` : ''}</td></tr>` : '<tr><td colspan="2" class="small muted">Ibutang ang distance para makita ang area.</td></tr>'}
    ${r.trays ? `<tr><td>Seedling trays (${o.tray} cells)</td><td>${fmtN(r.trays)} ka tray</td></tr>` : ''}
    ${r.cost ? `<tr><td>Gasto sa binhi</td><td>${money(r.cost)}</td></tr>` : ''}
  </table>`;
}
function calcHtml(o, r){
  if (o.mode !== 'area') return calcSeedHtml(o, r);
  if (!r.hills) return '<p class="small muted" style="margin:0">Ibutang ang area (ukon length × width) kag ang distance para ma-compute.</p>';
  const unitWord = o.packUnit === 'seeds' ? 'pack' : (o.packName || 'pack');
  const rowsTxt = r.rows ? `<tr><td>Rows</td><td>${fmtN(r.rows)} ka rows × ${fmtN(r.perRow)} ka tanom</td></tr>` : '';
  return `<table class="tbl">
    ${r.sqm ? `<tr><td>Area</td><td>${fmtN(r.sqm, 2)} sq.m${r.sqm >= 1000 ? ` (${fmtN(r.sqm/10000, 3)} ha)` : ''}</td></tr>` : ''}
    ${rowsTxt}
    <tr><td>Pila ka hills / tanom</td><td>${fmtN(r.hills)}</td></tr>
    <tr><td>Binhi kinahanglan (+${o.allow ?? 10}% extra)</td><td>${fmtN(r.seeds)} ka binhi</td></tr>
    ${r.grams != null ? `<tr><td>Timbang sang binhi</td><td>${r.grams >= 1000 ? fmtN(r.grams/1000, 2) + ' kg' : fmtN(r.grams, 1) + ' g'}</td></tr>` : ''}
    ${r.packs ? `<tr><td>I-prepare</td><td style="color:var(--green);font-size:16px">${fmtN(r.packs)} ka ${esc(unitWord)}</td></tr>` : ''}
    ${r.trays ? `<tr><td>Seedling trays (${o.tray} cells)</td><td>${fmtN(r.trays)} ka tray</td></tr>` : ''}
    ${r.cost ? `<tr><td>Estimated gasto sa binhi</td><td>${money(r.cost)}</td></tr>` : ''}
  </table>`;
}
function readCalcForm(){
  return {mode:v('f_mode'), packs:num('f_packs'), spp:num('f_spp'), germ:num('f_germ'), method:v('f_method'),
    area:num('f_area'), areaUnit:v('f_areaUnit'), len:num('f_len'), wid:num('f_wid'), rowCm:num('f_rowcm'), plCm:num('f_plcm'),
    sph:num('f_sph'), allow:num('f_allow'), spg:num('f_spg'), pack:num('f_pack'), packUnit:v('f_packUnit'), packName:v('f_packName').trim(),
    packPrice:num('f_packPrice'), tray:num('f_tray')};
}
function calcUpdate(src){
  if ((src === 'len' || src === 'wid') && num('f_len') > 0 && num('f_wid') > 0) {
    document.getElementById('f_area').value = round2(num('f_len') * num('f_wid'));
    document.getElementById('f_areaUnit').value = 'sqm';
  }
  const o = readCalcForm();
  const seedMode = o.mode !== 'area';
  document.querySelectorAll('.cm-seed').forEach(el => el.style.display = seedMode ? '' : 'none');
  document.querySelectorAll('.cm-area').forEach(el => el.style.display = seedMode ? 'none' : '');
  const tp = (SPACING[v('f_crop')] || {}).tp;
  $('#w_tray').style.display = (seedMode ? o.method !== 'direct' : tp) ? '' : 'none';
  $('#l_sph').firstChild.textContent = seedMode && o.method !== 'direct' ? 'Seedling kada butho' : 'Binhi kada butho';
  const res = calcPlan(o);
  if (seedMode && res.sqm) { document.getElementById('f_area').value = round2(res.sqm); document.getElementById('f_areaUnit').value = 'sqm'; }
  document.getElementById('calcOut').innerHTML = calcHtml(o, res);
}

const stat = (l, val, cls='') => `<div class="stat ${cls}"><div class="l">${l}</div><div class="v">${val}</div></div>`;

function viewDash(){
  const cost = sum(db.activities, a => a.cost), inc = sum(db.harvests, h => h.total), net = inc - cost;

  const alerts = getAlerts();

  return `
  <div class="stats">
    ${stat('Total nga Capital / Gasto', money(cost))}
    ${stat('Total nga Kita (Benta)', money(inc))}

  const harvested = s.hv.length > 0;
  return `<div class="card pcard" onclick="state.tab='records';go('planting','${p.id}')">
    <div class="pc-top"><span class="emoji">${c.emoji}</span>
      <div class="grow"><b>${esc(pName(p))}</b><div class="muted small">${esc(p.location||'')}${p.location && p.area ? ' · ' : ''}${areaLbl(p)}</div></div>
      <span class="chip st-${p.status}">${STATUS[p.status]||p.status}</span></div>

    <div class="small muted">${dap >= 0 ? `Day ${dap} (DAP)` : `${-dap} ka adlaw antes magtanom`} · Harvest ~${fmtD(addDays(p.datePlanted, Number(p.days)||0))}</div>` : ''}

}

function seedCard(p){
  if (!p.calc) return '';
  const o = Object.assign({}, p.calc, {area:p.area, areaUnit:p.areaUnit}), r = calcPlan(o);
  if (!r.hills && !r.seeds) return '';
  const hasSeedCost = db.activities.some(a => a.plantingId === p.id && a.category === 'seeds');
  const unitWord = o.mode !== 'area' ? (o.packName || 'pack') : o.packUnit === 'seeds' ? 'pack' : (o.packName || 'pack');
  const preset = JSON.stringify({plantingId:p.id, category:'seeds', desc:'Binhi', item:p.variety || '', qty:r.packs || null,
    unit:unitWord, unitCost:o.packPrice || null, cost:r.cost || null}).replace(/"/g, '&quot;');
  return `<details class="card" style="padding:12px 14px"><summary>🌰 Plano: ${fmtN(r.hills)} ka butho${r.sqm && r.mode === 'seed' ? ` · ${fmtN(r.sqm)} sq.m` : ''}${r.packs ? ` · ${fmtN(r.packs, 2)} ka ${esc(unitWord)} binhi` : ''}</summary>
    <div style="margin-top:8px">${calcHtml(o, r)}</div>
    ${!hasSeedCost && r.packs ? `<div class="btnrow" style="margin-bottom:0"><button class="btn sm" onclick="actForm(null, ${preset})">+ I-record ang binhi sa gasto</button></div>` : ''}
  </details>`;
}
function summaryHtml(p, s){
  const cats = Object.entries(s.byCat).filter(e => e[1] > 0).sort((a,b) => b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const ha = areaHa(p);
  const rows = [
    ['Total nga Capital (Gasto)', money(s.cost)],
    ['Total nga Kita (Benta)', money(s.income)],
    [s.net >= 0 ? 'Net Ganansya' : 'Net Lugi', `<span class="${s.net>=0?'pos':'neg'}">${money(Math.abs(s.net))}</span>`],
    ['ROI (Return on Investment)', s.roi == null ? '—' : `${round2(s.roi)}%`],
    ['Total nga Harvest', s.qty ? `${round2(s.qty)} ${esc(s.unit)}` : '—'],
    [`Gasto kada ${esc(s.unit)} (cost of production)`, s.qty ? money(s.cost / s.qty) : '—'],
    [`Average nga presyo kada ${esc(s.unit)}`, s.qty ? money(s.income / s.qty) : '—'],
    [`Break-even nga presyo kada ${esc(s.unit)}`, s.qty ? money(s.cost / s.qty) : '—'],
  ];
  if (ha && s.qty) rows.push([`Yield kada hectare`, `${round2(s.qty / ha).toLocaleString('en-PH')} ${esc(s.unit)}`]);
  if (ha) rows.push(['Gasto kada hectare', money(s.cost / ha)]);
  let msg = '';
  if (!s.hv.length && p.status !== 'done') msg = `<p class="small muted">Wala pa harvest. Ang gasto subong ${money(s.cost)} — amo ini ang kinahanglan mabawi sa benta.</p>`;
  else msg = s.net >= 0
    ? `<div class="alert"><div>✅ <b>May ganansya</b> kamo nga ${money(s.net)} sa sini nga tanom.</div></div>`
    : `<div class="alert danger"><div>❌ <b>Lugi</b> kamo sang ${money(-s.net)}${p.status !== 'done' ? ' sa subong (puwede pa mabawi kon may harvest pa)' : ''}.</div></div>`;
  return `${msg}
    <div class="card"><table class="tbl">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    <h3>Diin napunta ang capital</h3>
    <div class="card">${cats.length ? cats.map(([k,a]) => `<div class="cbar"><span class="n">${CATS[k]?.icon||''} ${esc(CATS[k]?.short||k)}</span><span class="t"><i style="width:${a/max*100}%"></i></span><span class="a">${money(a)}<br><span class="muted">${s.cost ? Math.round(a/s.cost*100) : 0}%</span></span></div>`).join('') : '<div class="empty">Wala pa gasto.</div>'}</div>
    <div class="btnrow"><button class="btn sm ghost" onclick="window.print()">🖨️ Print</button></div>`;
}

  else if (f.pid !== 'all') { acts = acts.filter(a => a.plantingId === f.pid); hv = hv.filter(h => h.plantingId === f.pid); }
  if (f.cat === 'harvest') acts = [];
  else if (f.cat !== 'all') { acts = acts.filter(a => a.category === f.cat); hv = []; }
  const items = [...acts.map(r => ({t:'a', r})), ...hv.map(r => ({t:'h', r}))]
    .sort((x,y) => y.r.date.localeCompare(x.r.date) || (y.r.updatedAt||'').localeCompare(x.r.updatedAt||''));
  const cost = sum(acts, a => a.cost), inc = sum(hv, h => h.total);
  let html = '', curM = '';
  const months = {};
  items.forEach(it => { const m = it.r.date.slice(0,7); months[m] = months[m] || {c:0,i:0}; if (it.t==='a') months[m].c += Number(it.r.cost)||0; else months[m].i += Number(it.r.total)||0; });
  items.forEach(it => {
    const m = it.r.date.slice(0,7);
    if (m !== curM) { if (curM) html += '</div>'; curM = m;
      html += `<div class="month"><span>${fmtMonth(it.r.date)}</span><span><span class="neg">-${money(months[m].c)}</span>${months[m].i ? ` <span class="pos">+${money(months[m].i)}</span>` : ''}</span></div><div class="card">`; }
    html += it.t === 'a' ? actRow(it.r) : hvRow(it.r);
  });
  if (curM) html += '</div>';
  const pOpts = `<option value="all">Tanan</option><option value="general" ${f.pid==='general'?'selected':''}>General farm expenses</option>` +
    db.plantings.map(p => `<option value="${p.id}" ${f.pid===p.id?'selected':''}>${crop(p).emoji} ${esc(pName(p))}</option>`).join('');
  const cOpts = `<option value="all">Tanan</option><option value="harvest" ${f.cat==='harvest'?'selected':''}>🧺 Harvest / Benta</option>` +
    Object.entries(CATS).map(([k,c]) => `<option value="${k}" ${f.cat===k?'selected':''}>${c.icon} ${c.short}</option>`).join('');
  return `<div class="btnrow"><button class="btn sm" onclick="actForm()">+ Gasto / Activity</button><button class="btn sm ghost" onclick="hvForm()">+ Harvest / Benta</button></div>
    <div class="row2"><label>Tanom<select onchange="state.filter.pid=this.value;render()">${pOpts}</select></label>
    <label>Category<select onchange="state.filter.cat=this.value;render()">${cOpts}</select></label></div>
    <div class="stats" style="margin-top:12px">${stat('Gasto', money(cost))}${stat('Kita', money(inc))}${stat('Net', money(inc-cost), inc-cost >= 0 ? 'pos' : 'neg')}</div>
    ${items.length ? html : '<div class="card empty" style="margin-top:12px">Wala sang record.</div>'}`;
}

  const sec = (t, arr) => `<h3>${t}</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;

}

let modalSave = null, modalDel = null;
function modal(title, body, onSave, onDel){
  $('#m_title').textContent = title; $('#m_body').innerHTML = body;

  $('#m_foot').innerHTML = onSave ? `${onDel ? '<button class="btn red" style="flex:0 0 auto" onclick="modalDelClick()">🗑</button>' : ''}<button class="btn ghost" onclick="closeModal()">Kanselar</button><button class="btn" onclick="modalSaveClick()">I-save</button>` : '';
  $('#modal').classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); modalSave = modalDel = null; }
function modalSaveClick(){ if (modalSave && modalSave() !== false) { closeModal(); render(); } }
function modalDelClick(){ if (modalDel && confirm('Sigurado ka nga panason ini?')) { modalDel(); save(); closeModal(); render(); toast('Napanas na'); } }

function cropChanged(init){

    <div class="row2"><label>Buyer / Diin ginbaligya<input id="f_buyer" value="${esc(h.buyer||'')}"></label>
    <label>Grade / Klase<input id="f_grade" value="${esc(h.grade||'')}" placeholder="hal. Class A, reject"></label></div>
    <label>Notes<textarea id="f_notes">${esc(h.notes||'')}</textarea></label>
    <p class="hint">Kon may rejects nga wala nabaligya, i-encode gihapon nga ₱0 para makita ang tanan nga harvest.</p>
    <datalist id="hunits"><option>kg</option><option>pcs</option><option>sack</option><option>bundle</option><option>crate</option><option>head</option></datalist>`,
  () => {
    if (!v('f_date')) { toast('Butangi sang petsa'); return false; }
    let total = num('f_total');
    if (total == null && num('f_qty') != null && num('f_price') != null) total = round2(num('f_qty') * num('f_price'));
    const r = Object.assign(h, {plantingId:v('f_pid'), date:v('f_date'), qty:num('f_qty'), unit:v('f_unit').trim() || 'kg', price:num('f_price'),
      total:total || 0, buyer:v('f_buyer').trim(), grade:v('f_grade').trim(), notes:v('f_notes')});
    upsert('harvests', r);
    const p = getP(r.plantingId);
    if (p && (p.status === 'growing' || p.status === 'land_prep')) { p.status = 'harvesting'; upsert('plantings', p); }
    toast('Na-save ang harvest');
  },
  id ? () => removeRec('harvests', id) : null);
  phiCheck();
}
function phiCheck(){
  const pid = v('f_pid'), d = v('f_date'), el = $('#phiWarn'); if (!el) return;
  const bad = db.activities.filter(a => a.plantingId === pid && a.category === 'pesticide' && Number(a.phi) > 0 && addDays(a.date, Number(a.phi)) > d);
  el.innerHTML = bad.length ? `<div class="alert danger" style="margin-top:10px"><div>⚠️ Sulod pa sa PHI sang ${bad.map(a => esc(a.item||'spray')).join(', ')}. Safe mag-harvest sa ${fmtD(bad.map(a => addDays(a.date, Number(a.phi))).sort().pop())}.</div></div>` : '';
}

function toggleTask(pid, i){
  const p = getP(pid); p.done = Object.assign({}, p.done);
  if (p.done[i]) delete p.done[i]; else p.done[i] = today();
  upsert('plantings', p); render();
}
function logTask(pid, i){
  const p = getP(pid), t = schedule(p)[i];
  if (t.cat === 'harvest_cost' && t.label.toLowerCase().includes('harvest')) {
    modal('Harvest', `<div class="menu"><button onclick="closeModal();hvForm(null,{plantingId:'${pid}'})"><span class="emoji">🧺</span>I-record ang harvest / benta</button>
      <button onclick="closeModal();actForm(null,{plantingId:'${pid}',category:'harvest_cost',desc:'Harvest labor'})"><span class="emoji">👷</span>I-record ang gasto sa pag-harvest</button></div>`);
    return;
  }
  actForm(null, {plantingId:pid, category:t.cat, desc:t.label});
}

/* ---------- GitHub sync ---------- */
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c => c.charCodeAt(0)));
function ghOwnerFromUrl(){ const h = location.hostname; return h.endsWith('.github.io') ? h.slice(0, -'.github.io'.length) : ''; }
function ghUrl(c){ return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`; }
async function ghErr(r){
  let m = ''; try { m = (await r.json()).message || ''; } catch(e){}
  if (r.status === 401) return 'Sala ang token ukon expired na.';
  if (r.status === 403) return 'Wala permiso ang token (kinahanglan Contents: Read and write). ' + m;
  if (r.status === 404) return 'Wala makit-an ang repo. I-check ang username, repo name, kag branch.';
  return `GitHub error ${r.status}: ${m}`;
}
async function ghGet(c){
  const h = {Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json'};
  const url = ghUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main') + '&t=' + Date.now();
  const r = await fetch(url, {headers:h, cache:'no-store'});
  if (r.status === 404) {
    // file not yet created — check that the repo itself exists
    const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, {headers:h});
    if (!rr.ok) throw new Error(await ghErr(rr));
    return {data:null, sha:null};
  }
  if (!r.ok) throw new Error(await ghErr(r));
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : null;
  if (!text) { // file larger than 1 MB
    const r2 = await fetch(url, {headers:{...h, Accept:'application/vnd.github.raw+json'}, cache:'no-store'});
    if (!r2.ok) throw new Error(await ghErr(r2));
    text = await r2.text();
  }
  return {data: text ? JSON.parse(text) : null, sha:j.sha};
}
async function ghPut(c, data, sha){
  const body = {message:'Farm Tracker sync ' + new Date().toLocaleString('en-PH'), content:b64enc(JSON.stringify(data, null, 1)), branch:c.branch || 'main'};
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(c), {method:'PUT', headers:{Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw new Error(await ghErr(r));
  return (await r.json()).content.sha;
}
let syncing = false;
async function syncNow(silent){
  const c = cfg();
  const miss = [!c.owner && 'GitHub username', !c.repo && 'Data repo name', !c.token && 'Token'].filter(Boolean);
  if (miss.length) { if (!silent) { toast('Kulang sa Settings: ' + miss.join(', ')); go('settings'); } return; }
  if (syncing) return;
  if (!navigator.onLine) { if (!silent) toast('Wala internet. Naka-save ang data sa cellphone; i-sync lang liwat dayon.'); return; }
  syncing = true; updateSyncBtn();
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const {data, sha} = await ghGet(c);
      const merged = data ? mergeDb(db, data) : db;
      try { await ghPut(c, merged, sha); db = merged; break; }
      catch(e){ if (!e.conflict || attempt === 2) throw e; }
    }
    persist();
    const c2 = cfg(); c2.dirty = false; c2.lastSync = nowISO(); setCfg(c2);
    if (!silent) toast('✅ Na-sync na sa GitHub');
    syncing = false; render();
  } catch(e) {
    syncing = false; updateSyncBtn();
    toast('❌ Sync failed: ' + e.message);
  }
}
function updateSyncBtn(){
  const b = $('#syncBtn'), c = cfg(); if (!b) return;
  b.textContent = syncing ? '⟳ Syncing…' : !c.token ? '☁ Setup sync' : c.dirty ? '☁ Sync •' : '☁ Synced';
}
function saveCfg(){
  const c = cfg();
  Object.assign(c, {owner:v('g_owner').trim(), repo:v('g_repo').trim(), branch:v('g_branch').trim() || 'main',
    path:v('g_path').trim() || 'farm-data.json', token:v('g_token').trim(), auto:$('#g_auto').checked});
  setCfg(c); syncNow();
}

/* ---------- Backup / export ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON(){ download(`farm-backup-${today()}.json`, JSON.stringify(db, null, 1), 'application/json'); }
function importJSON(input){
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.plantings)) throw new Error('Indi ini Farm Tracker backup');
      db = mergeDb(db, Object.assign(emptyDb(), d)); save(); render(); toast('Na-restore ang backup');
    } catch(e){ toast('Error: ' + e.message); }
    input.value = '';
  };
  rd.readAsText(f);
}
function exportCSV(){
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Type','Date','Crop/Planting','Category','Description','Item','Qty','Unit','Price per unit','Amount (PHP)','Pest/Target','Severity','PHI days','Buyer','Notes']];
  const pn = id => { const p = getP(id); return p ? pName(p) : 'General'; };
  [...db.activities].sort((a,b) => a.date.localeCompare(b.date)).forEach(a => rows.push(['Expense', a.date, pn(a.plantingId), CATS[a.category]?.short || a.category, a.desc, a.item, a.qty, a.unit, a.unitCost, a.cost, a.pest || a.target, a.severity, a.phi, '', a.notes]));
  [...db.harvests].sort((a,b) => a.date.localeCompare(b.date)).forEach(h => rows.push(['Harvest/Sale', h.date, pn(h.plantingId), 'Harvest', h.grade, '', h.qty, h.unit, h.price, h.total, '', '', '', h.buyer, h.notes]));
  rows.push([]);
  rows.push(['SUMMARY PER CROP','','','','','','','','','','','','','','']);
  rows.push(['Crop','Date planted','Status','Area','Capital (PHP)','Income (PHP)','Net (PHP)','ROI %','Harvest qty','Unit','Cost per unit']);
  db.plantings.forEach(p => { const s = stats(p.id); rows.push([pName(p), p.datePlanted, STATUS[p.status], areaLbl(p), round2(s.cost), round2(s.income), round2(s.net), s.roi == null ? '' : round2(s.roi), round2(s.qty), s.unit, s.qty ? round2(s.cost/s.qty) : '']); });
  download(`farm-records-${today()}.csv`, '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function clearAll(){
  if (!confirm('Panason ang TANAN nga data sa sini nga cellphone? (Ang naka-sync sa GitHub indi madula.)')) return;
  if (prompt('I-type ang PANAS para magpadayon') !== 'PANAS') return;
  db = emptyDb(); persist(); const c = cfg(); delete c.lastSync; c.dirty = false; setCfg(c); render(); toast('Napanas na');
}


/* ---------- Install as app (PWA) ---------- */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').style.display = ''; if (state.view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').style.display = 'none'; toast('✅ Na-install na ang Farm Tracker'); });
async function installApp(){
  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') { installEvt = null; $('#installBtn').style.display = 'none'; } return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  modal('Paano i-install', ios
    ? `<ol><li>Buksi ini nga app sa <b>Safari</b>.</li><li>Pindota ang <b>Share</b> (kahon nga may pana pataas) sa idalom.</li><li>Pilia ang <b>Add to Home Screen</b> → <b>Add</b>.</li></ol>`
    : `<ol><li>Buksi ini nga app sa <b>Google Chrome</b> (indi sa Messenger/Facebook browser).</li><li>Pindota ang <b>⋮</b> sa ibabaw sa tuo.</li><li>Pilia ang <b>Install app</b> (ukon <b>Add to Home screen → Install</b>).</li></ol>
       <p class="small muted">Kon wala ang "Install app": siguroha nga ang link nagasugod sa <b>https://</b> kag halin sa GitHub Pages, indi file nga gin-download sa cellphone.</p>`);
}

/* ---------- Start ---------- */
readHash(); render();
window.addEventListener('online', () => { const c = cfg(); if (c.auto && c.dirty) syncNow(true); });
(() => { const c = cfg(); if (c.auto && c.token) syncNow(true); })();
</script>
