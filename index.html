    if (cat === 'fertilizer') r.method = v('f_method');
    upsert('activities', r); toast('Na-save');
  },
  id ? () => removeRec('activities', id) : null);
  catChanged();
}
function catChanged(){
  const c = v('f_cat');
  document.querySelectorAll('.cx').forEach(el => el.style.display = el.dataset.c === c ? '' : 'none');
  $('#h_labor').style.display = c === 'labor' || c === 'weeding' || c === 'harvest_cost' ? '' : 'none';
  $('#h_pm').style.display = c === 'pest_monitoring' ? '' : 'none';
}
function calcTotal(q, u, t){ const a = num(q), b = num(u); if (a != null && b != null) document.getElementById(t).value = round2(a * b); }

    <label>Total nga kita (₱)<input type="number" step="any" inputmode="decimal" id="f_total" value="${h.total??''}" oninput="agentCalc()"></label>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="f_viaAgent" ${h.viaAgent === false ? '' : 'checked'} onchange="agentCalc()"> Gibaligya pinaagi sa agente (${fmtN(h.agentPct ?? agentPct(), 1)}% sa gross)</label>
    <div id="agentOut" class="small"></div>
    <div class="row2"><label>Buyer / Diin ginbaligya<input id="f_buyer" value="${esc(h.buyer||'')}"></label>
    <label>Grade / Klase<input id="f_grade" value="${esc(h.grade||'')}" placeholder="hal. Class A, reject"></label></div>
    <label>Notes<textarea id="f_notes">${esc(h.notes||'')}</textarea></label>
    <p class="hint">Kon may rejects nga wala nabaligya, i-encode gihapon nga ₱0 para makita ang tanan nga harvest.</p>
    <datalist id="hunits"><option>kg</option><option>pcs</option><option>sack</option><option>bundle</option><option>crate</option><option>head</option></datalist>`,
  () => {
    if (!v('f_date')) { toast('Butangi sang petsa'); return false; }
    let total = num('f_total');
    if (total == null && num('f_qty') != null && num('f_price') != null) total = round2(num('f_qty') * num('f_price'));
    const r = Object.assign(h, {plantingId:v('f_pid'), date:v('f_date'), qty:num('f_qty'), unit:v('f_unit').trim() || 'kg', price:num('f_price'),
      total:total || 0, buyer:v('f_buyer').trim(), grade:v('f_grade').trim(), notes:v('f_notes'),
      viaAgent:$('#f_viaAgent').checked, agentPct:h.agentPct ?? agentPct()});
    upsert('harvests', r);
    const p = getP(r.plantingId);
    if (p && (p.status === 'growing' || p.status === 'land_prep')) { p.status = 'harvesting'; upsert('plantings', p); }
    toast('Na-save ang harvest');
  },
  id ? () => removeRec('harvests', id) : null);
  phiCheck(); agentCalc._pct = null; agentCalc(h.agentPct);
}
function agentCalc(pct){
  const el = $('#agentOut'); if (!el) return;
  pct = pct ?? agentCalc._pct ?? agentPct(); agentCalc._pct = pct;
  let tot = num('f_total'); if (tot == null && num('f_qty') != null && num('f_price') != null) tot = num('f_qty') * num('f_price');
  el.innerHTML = $('#f_viaAgent').checked && tot ? `Agente: <b class="neg">−${money(tot * pct / 100)}</b> · Nadawat sa uma: <b>${money(tot * (1 - pct / 100))}</b>` : '';
}
function phiCheck(){
  const pid = v('f_pid'), d = v('f_date'), el = $('#phiWarn'); if (!el) return;
  const bad = db.activities.filter(a => a.plantingId === pid && a.category === 'pesticide' && Number(a.phi) > 0 && addDays(a.date, Number(a.phi)) > d);
  el.innerHTML = bad.length ? `<div class="alert danger" style="margin-top:10px"><div>⚠️ Sulod pa sa PHI sang ${bad.map(a => esc(a.item||'spray')).join(', ')}. Safe mag-harvest sa ${fmtD(bad.map(a => addDays(a.date, Number(a.phi))).sort().pop())}.</div></div>` : '';
}

function toggleTask(pid, id){
  const p = getP(pid), sx = schedule(p).find(x => x.id === String(id)); if (!sx) return;
  if (sx.done || sx.rec) {
    if (sx.rec) removeRec('activities', sx.rec.id);
    if (p.done && p.done[sx.id]) { p.done = Object.assign({}, p.done); delete p.done[sx.id]; upsert('plantings', p); } else save();
    render(); return;
  }
  if (findItem(sx.key)) { wkDone(sx.key); return; }
  recordItem({p, kind: sx.cat === 'fertilizer' ? 'fert' : sx.cat === 'pest_monitoring' ? 'pest' : 'task', key:sx.key, label:sx.label, cat:sx.cat}, 'done');
  render();
}
function logTask(pid, id){
  const p = getP(pid), t = schedule(p).find(x => x.id === String(id)); if (!t) return;
  if (t.cat === 'harvest_cost' && t.label.toLowerCase().includes('harvest')) {
    modal('Harvest', `<div class="menu"><button onclick="closeModal();hvForm(null,{plantingId:'${pid}'})"><span class="emoji">🧺</span>I-record ang harvest / benta</button>
      <button onclick="closeModal();actForm(null,{plantingId:'${pid}',category:'harvest_cost',desc:'Harvest labor'})"><span class="emoji">👷</span>I-record ang gasto sa pag-harvest</button></div>`);
    return;
  }
  actForm(null, {plantingId:pid, category:t.cat, desc:t.label});
}

/* ---------- GitHub sync ---------- */
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c => c.charCodeAt(0)));
function ghOwnerFromUrl(){ const h = location.hostname; return h.endsWith('.github.io') ? h.slice(0, -'.github.io'.length) : ''; }
function ghUrl(c){ return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`; }
async function ghErr(r){
  let m = ''; try { m = (await r.json()).message || ''; } catch(e){}
  if (r.status === 401) return 'Sala ang token ukon expired na.';
  if (r.status === 403) return 'Wala permiso ang token (kinahanglan Contents: Read and write). ' + m;
  if (r.status === 404) return 'Wala makit-an ang repo. I-check ang username, repo name, kag branch.';
  return `GitHub error ${r.status}: ${m}`;
}
/* GET with ETag: kon walay nausab sa GitHub, mobalik dayon og 304 (paspas, walay download). */
async function ghGet(c){
  const h = {Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json'};
  const url = ghUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main');
  const condH = c.etag && c.sha ? Object.assign({'If-None-Match':c.etag}, h) : h;
  const r = await fetch(url, {headers:condH, cache:'no-store'});
  if (r.status === 304) return {same:true, sha:c.sha};
  if (r.status === 404) {
    // file not yet created — check that the repo itself exists
    const rr = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, {headers:h});
    if (!rr.ok) throw new Error(await ghErr(rr));
    return {data:null, sha:null};
  }
  if (!r.ok) throw new Error(await ghErr(r));
  const etag = r.headers.get('ETag');
  const j = await r.json();
  let text = j.content ? b64dec(j.content) : null;
  if (!text) { // file larger than 1 MB
    const r2 = await fetch(url, {headers:{...h, Accept:'application/vnd.github.raw+json'}, cache:'no-store'});
    if (!r2.ok) throw new Error(await ghErr(r2));
    text = await r2.text();
  }
  return {data: text ? JSON.parse(text) : null, sha:j.sha, etag};
}
async function ghPut(c, data, sha){
  const body = {message:'Farm Tracker sync ' + new Date().toLocaleString('en-PH'), content:b64enc(JSON.stringify(data)), branch:c.branch || 'main'};
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(c), {method:'PUT', headers:{Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw new Error(await ghErr(r));
  return (await r.json()).content.sha;
}
/* Naay bag-o ba sa "a" nga wala sa "b"? (para dili na mag-upload kon pareha ra) */
function dbHasNews(a, b){
  if (!b) return true;
  for (const c of COLLS) {
    const m = new Map((b[c] || []).map(r => [r.id, r.updatedAt || '']));
    for (const r of (a[c] || [])) if (!m.has(r.id) || (r.updatedAt || '') > m.get(r.id)) return true;
  }
  for (const k of Object.keys(a.deleted || {})) if (!(b.deleted || {})[k]) return true;
  return false;
}
function dbSig(d){ return COLLS.map(c => (d[c] || []).map(r => r.id + '@' + (r.updatedAt || '')).sort().join(',')).join('|') + '|' + Object.keys(d.deleted || {}).length; }
let syncing = false, pendingRender = false;
function safeRender(){
  const ae = document.activeElement, main = $('#main');
  const typing = ae && main && main.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if (typing) { pendingRender = true; return; }
  pendingRender = false; render();
}
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(safeRender, 50); });
async function syncNow(silent){
  const c = cfg();
  const miss = [!c.owner && 'GitHub username', !c.repo && 'Data repo name', !c.token && 'Token'].filter(Boolean);
  if (miss.length) { if (!silent) { toast('Kulang sa Settings: ' + miss.join(', ')); go('settings'); } return; }
  if (syncing) { syncNow.again = true; return; }
  if (!navigator.onLine) { if (!silent) toast('Wala internet. Naka-save ang data sa cellphone; i-sync lang liwat dayon.'); return; }
  syncing = true; updateSyncBtn();
  const seq0 = editSeq, sig0 = dbSig(db), t0 = Date.now();
  let pushed = false;
  try {
    try { await uploadPhotos(c); } catch(e) {}
    for (let attempt = 0; attempt < 3; attempt++) {
      const cc = cfg();
      const g = await ghGet(cc);
      if (g.same) {                                   // walay nausab sa GitHub
        if (!cc.dirty && editSeq === seq0) break;     // walay nausab diri → human na (paspas)
        try { const sha = await ghPut(cc, db, cc.sha); const c3 = cfg(); c3.sha = sha; c3.etag = null; setCfg(c3); pushed = true; break; }
        catch(e){ if (!e.conflict || attempt === 2) throw e; const c3 = cfg(); c3.etag = null; setCfg(c3); continue; }
      }
      const remote = g.data;
      const merged = remote ? mergeDb(db, remote) : db;
      if (remote && !dbHasNews(merged, remote)) {     // ang GitHub naa na tanan → kuha ra, walay upload
        db = mergeDb(db, merged);
        const c3 = cfg(); c3.sha = g.sha; c3.etag = g.etag || null; setCfg(c3); break;
      }
      try {
        const sha = await ghPut(cc, merged, g.sha); db = mergeDb(db, merged); pushed = true;   // dili mawala ang bag-ong tap samtang nag-sync
        const c3 = cfg(); c3.sha = sha; c3.etag = null; setCfg(c3); break;
      } catch(e){ if (!e.conflict || attempt === 2) throw e; }
    }
    persist();
    const c2 = cfg(); c2.dirty = editSeq !== seq0; c2.lastSync = nowISO(); c2.lastSyncMs = Date.now() - t0; setCfg(c2);
    if (!silent) toast(`✅ Na-sync na (${((Date.now() - t0) / 1000).toFixed(1)} seg)`);
    syncing = false; updateSyncBtn();
    if (dbSig(db) !== sig0) { statsCache.clear(); safeRender(); }
    if ((c2.dirty && c2.auto) || syncNow.again) { syncNow.again = false; setTimeout(() => syncNow(true), 800); }
  } catch(e) {
    syncing = false; updateSyncBtn();
    if (!silent || !/Failed to fetch|NetworkError|Load failed/i.test(e.message)) toast('❌ Sync failed: ' + e.message);
  }
}
/* Awtomatikong kuha sa bag-o gikan sa laing cellphone/computer */
const PULL_EVERY = 30000;
setInterval(() => { const c = cfg(); if (c.auto && c.token && document.visibilityState === 'visible' && navigator.onLine) syncNow(true); }, PULL_EVERY);
document.addEventListener('visibilitychange', () => { const c = cfg(); if (document.visibilityState === 'visible' && c.auto && c.token) syncNow(true); });
window.addEventListener('focus', () => { const c = cfg(); if (c.auto && c.token && Date.now() - (syncNow._lastFocus || 0) > 10000) { syncNow._lastFocus = Date.now(); syncNow(true); } });
function updateSyncBtn(){
  const b = $('#syncBtn'), c = cfg(); if (!b) return;
  b.textContent = syncing ? '⟳ Syncing…' : !c.token ? '☁ Setup sync' : c.dirty ? '☁ Sync •' : '☁ Synced ' + (c.lastSync ? new Date(c.lastSync).toLocaleTimeString('en-PH', {hour:'numeric', minute:'2-digit'}) : '');
}
function saveCfg(){
  const c = cfg();
  Object.assign(c, {owner:v('g_owner').trim(), repo:v('g_repo').trim(), branch:v('g_branch').trim() || 'main',
    path:v('g_path').trim() || 'farm-data.json', token:v('g_token').trim(), auto:$('#g_auto').checked});
  c.etag = null; c.sha = null; setCfg(c); syncNow();
}

/* ---------- Backup / export ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON(){ download(`farm-backup-${today()}.json`, JSON.stringify(db, null, 1), 'application/json'); }
function importJSON(input){
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.plantings)) throw new Error('Indi ini Farm Tracker backup');
      db = mergeDb(db, Object.assign(emptyDb(), d)); save(); render(); toast('Na-restore ang backup');
    } catch(e){ toast('Error: ' + e.message); }
    input.value = '';
  };
  rd.readAsText(f);
}
function exportCSV(){
  const q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Type','Date','Crop/Planting','Category','Description','Item','Qty','Unit','Price per unit','Amount (PHP)','Pest/Target','Severity','PHI days','Buyer','Notes']];
  const pn = id => { const p = getP(id); return p ? pName(p) : 'General'; };
  [...db.activities].sort((a,b) => a.date.localeCompare(b.date)).forEach(a => rows.push(['Expense', a.date, pn(a.plantingId), CATS[a.category]?.short || a.category, a.desc, a.item, a.qty, a.unit, a.unitCost, a.cost, a.pest || a.target, a.severity, a.phi, '', a.notes]));
  [...db.harvests].sort((a,b) => a.date.localeCompare(b.date)).forEach(h => rows.push(['Harvest/Sale', h.date, pn(h.plantingId), 'Harvest', h.grade, '', h.qty, h.unit, h.price, h.total, '', '', '', h.buyer, h.notes]));
  rows.push([]);
  rows.push(['SUMMARY PER CROP','','','','','','','','','','','','','','']);
  rows.push(['Crop','Date planted','Status','Area','Caretaker','Gross sales (PHP)','Agent commission','Direct expenses','General expenses share','Net (PHP)','Caretaker %','Caretaker share','Owner share','Paid to caretaker','ROI %','Harvest qty','Unit','Cost per unit']);
  db.plantings.forEach(p => { const s = stats(p.id); rows.push([pName(p), p.datePlanted, STATUS[p.status], areaLbl(p), s.ct ? s.ct.name : '', round2(s.income), round2(s.agent), round2(s.cost), round2(s.gen), round2(s.net), s.ctPct || '', round2(s.ctShare), round2(s.owner), p.sharePaid ? p.sharePaid.amount : '', s.roi == null ? '' : round2(s.roi), round2(s.qty), s.unit, s.qty ? round2(s.allCost/s.qty) : '']); });
  download(`farm-records-${today()}.csv`, '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function clearAll(){
  if (!confirm('Panason ang TANAN nga data sa sini nga cellphone? (Ang naka-sync sa GitHub indi madula.)')) return;
  if (prompt('I-type ang PANAS para magpadayon') !== 'PANAS') return;
  db = emptyDb(); persist(); const c = cfg(); delete c.lastSync; c.dirty = false; setCfg(c); render(); toast('Napanas na');
}


/* ---------- Install as app (PWA) ---------- */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').style.display = ''; if (state.view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').style.display = 'none'; toast('✅ Na-install na ang Farm Tracker'); });
async function installApp(){
  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; if (r.outcome === 'accepted') { installEvt = null; $('#installBtn').style.display = 'none'; } return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  modal('Paano i-install', ios
    ? `<ol><li>Buksi ini nga app sa <b>Safari</b>.</li><li>Pindota ang <b>Share</b> (kahon nga may pana pataas) sa idalom.</li><li>Pilia ang <b>Add to Home Screen</b> → <b>Add</b>.</li></ol>`
    : `<ol><li>Buksi ini nga app sa <b>Google Chrome</b> (indi sa Messenger/Facebook browser).</li><li>Pindota ang <b>⋮</b> sa ibabaw sa tuo.</li><li>Pilia ang <b>Install app</b> (ukon <b>Add to Home screen → Install</b>).</li></ol>
       <p class="small muted">Kon wala ang "Install app": siguroha nga ang link nagasugod sa <b>https://</b> kag halin sa GitHub Pages, indi file nga gin-download sa cellphone.</p>`);
}

/* ---------- Start ---------- */
readHash(); render();
window.addEventListener('online', () => { const c = cfg(); if (c.auto && c.dirty) syncNow(true); });
(() => { const c = cfg(); if (c.auto && c.token) syncNow(true); })();
</script>
